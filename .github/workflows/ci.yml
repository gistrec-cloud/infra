name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Ansible + ansible-lint
        run: pip install "ansible-core==2.21.1" "ansible-lint==26.6.0"
      - name: Install Galaxy collections
        run: ansible-galaxy collection install -r ansible/requirements.yml
      - name: Stub vault password file
        # ansible.cfg points vault_password_file at the gitignored .vault_pass;
        # without it every syntax-check ansible-lint runs errors out. Nothing
        # vault-encrypted is in the repo, so the value is never used.
        run: echo ci-dummy > ansible/.vault_pass
      - name: Run ansible-lint
        working-directory: ansible
        run: ansible-lint

  terraform:
    name: terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    env:
      # Provider binaries land in a cache dir instead of six per-module .terraform
      # copies — one download of the ~200 MB yandex provider per run, and none at
      # all on a cache hit.
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.terraform-plugin-cache
      TF_IN_AUTOMATION: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Restore the provider cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.terraform-plugin-cache
          key: tf-providers-${{ runner.os }}-${{ hashFiles('terraform/**/versions.tf') }}
          restore-keys: tf-providers-${{ runner.os }}-
      - name: Check formatting
        run: terraform fmt -check -recursive
      - name: Validate each module
        # Auto-discover every root module (any immediate subdir with a .tf) so
        # a new module is covered without editing this list — the hardcoded
        # "dns aws hetzner yandex" silently skipped yandex-budget-explorer and
        # yandex-vk-ads-tool.
        #
        # `init` is retried: it reaches the registry *and* GitHub releases for
        # provider checksums, and a single timed-out request there fails a run that
        # has nothing to do with the change under review (2026-08-13, run
        # 31652868402: "could not query provider registry" on the yandex provider).
        run: |
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          retry() {
            for attempt in 1 2 3; do
              "$@" && return 0
              echo "::warning::attempt ${attempt}/3 failed: $* — retrying"
              sleep $((attempt * 15))
            done
            return 1
          }
          for d in */; do
            [ -n "$(find "$d" -maxdepth 1 -name '*.tf' -print -quit)" ] || continue
            echo "== ${d%/} =="
            retry terraform -chdir="${d%/}" init -backend=false
            terraform -chdir="${d%/}" validate
          done

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          VERSION=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
      - name: Scan git history for secrets
        run: gitleaks detect --source . --redact --verbose
