---
# Private WireGuard mesh between fleet hosts. Every node gets a stable private IP
# on wg0 (10.10.0.0/24 by convention) so services — MySQL replication first —
# ride an encrypted tunnel instead of the public internet. There is no
# `wireguard` inventory group: peers are every other host in `all` that defines
# wireguard_ip (see templates/wg.conf.j2). Each carries wireguard_ip +
# wireguard_pubkey in its (gitignored) host_vars, and its public endpoint is its
# inventory ansible_host.
wireguard_interface: wg0
wireguard_subnet_cidr: 24
wireguard_port: 51820

# This host's private key — from the vault, keyed by host: vault_wg_privkey_<host>
# with dashes as underscores (e.g. vault_wg_privkey_russia_03). Generate a pair
# with: wg genkey | tee privatekey | wg pubkey > publickey
wireguard_private_key: "{{ lookup('vars', 'vault_wg_privkey_' ~ (inventory_hostname | replace('-', '_')), default='') }}"

# NAT keepalive (seconds). Both live members now hold their public IP directly
# (Hetzner, Timeweb) — the Yandex 1:1 NAT this was written for went with
# russia-01 (2026-08-19). Kept: cheap, and it also holds stateful-firewall state.
wireguard_keepalive: 25

# Хост с несколькими адресами на интерфейсе уходит к пирам с того, который
# выберет ядро, — а правила у пиров привязаны к его ansible_host. Если адреса
# расходятся, рукопожатие молча дропается на той стороне.
# Пусто = выключено (у хоста один адрес, выбирать не из чего).
# Заполнено = юнит fleet-static-routes.service прибивает маршрут до КАЖДОГО пира
# к этому источнику, так что новый пир покрывается сам.
wireguard_egress_src: ""
wireguard_egress_gateway: "{{ ansible_default_ipv4.gateway | default('') }}"
wireguard_egress_device: "{{ ansible_default_ipv4.interface | default('') }}"
