---
- name: Derive paths — {{ apppm2_app.key }}
  ansible.builtin.set_fact:
    apppm2_home: "/home/{{ admin_user }}"
    apppm2_dir: >-
      {{ '/home/' ~ admin_user ~ ('' if apppm2_app.value.dir | default('.') == '.'
         else '/' ~ apppm2_app.value.dir) }}

# ── code ──
# repo_dir: clone destination when the repo root is ABOVE the app cwd
# (recepter: repo at ~/backend, cwd backend/back).
- name: Check the code directory — {{ apppm2_app.key }}
  ansible.builtin.stat:
    path: "{{ apppm2_home }}/{{ apppm2_app.value.process.repo_dir | default(apppm2_app.value.dir) }}"
  register: apppm2_code
  when: apppm2_app.value.process.type == 'clone'

# Clone ONLY into a missing directory: several live deployments are rsync
# copies without .git (aleksandravoo, budget-explorer) — the git module would
# fail on them, and they already carry the running code. Adopt, don't touch.
# No version pin on purpose: we clone the default branch tip once; updates
# are owned by CI / manual flows.
- name: Clone the repository, only if absent — {{ apppm2_app.key }} # noqa: latest
  ansible.builtin.git:
    repo: "git@github.com:{{ apppm2_app.value.repo }}.git"
    dest: "{{ apppm2_home }}/{{ apppm2_app.value.process.repo_dir | default(apppm2_app.value.dir) }}"
    update: false
    accept_newhostkey: true
  become: true
  become_user: "{{ admin_user }}"
  when:
    - apppm2_app.value.process.type == 'clone'
    - apppm2_app.value.repo is defined
    - not (apppm2_code.stat.exists | default(true))

# Updating a checkout is opt-in AND per app. A converge that silently
# fast-forwarded every clone app would ship whatever sits on each default
# branch tip — reviewed or not — across the whole fleet, which is why the
# clone above is a one-shot. Naming the app makes the deploy a decision:
#   -e apppm2_code_refresh=glucose-bot
#   -e apppm2_code_refresh=glucose-bot,askads-ru
- name: Check for a git checkout — {{ apppm2_app.key }}
  ansible.builtin.stat:
    path: "{{ apppm2_home }}/{{ apppm2_app.value.process.repo_dir | default(apppm2_app.value.dir) }}/.git"
  register: apppm2_git
  when:
    - apppm2_app.value.process.type == 'clone'
    - apppm2_app.key in (apppm2_code_refresh | default('')).split(',')

# Named an app that is an rsync copy without .git (aleksandravoo,
# budget-explorer)? Say so, rather than letting the git module fail obscurely.
- name: Refuse to refresh a checkout that is not a git clone — {{ apppm2_app.key }}
  ansible.builtin.fail:
    msg: >-
      {{ apppm2_app.key }}: asked to refresh the code, but there is no .git —
      this deployment is an rsync copy or a CI artifact, and its updates are
      owned by whatever put it there.
  when:
    - apppm2_app.value.process.type == 'clone'
    - apppm2_app.key in (apppm2_code_refresh | default('')).split(',')
    - not (apppm2_git.stat.exists | default(false))

# force: false (the default) on purpose — local edits on the host are somebody
# mid-debug, and discarding them silently is worse than a failed converge.
- name: Update the repository — {{ apppm2_app.key }} # noqa: latest
  ansible.builtin.git:
    repo: "git@github.com:{{ apppm2_app.value.repo }}.git"
    dest: "{{ apppm2_home }}/{{ apppm2_app.value.process.repo_dir | default(apppm2_app.value.dir) }}"
    update: true
    accept_newhostkey: true
  become: true
  become_user: "{{ admin_user }}"
  register: apppm2_pull
  when:
    - apppm2_app.value.process.type == 'clone'
    - apppm2_app.value.repo is defined
    - apppm2_app.key in (apppm2_code_refresh | default('')).split(',')
    - apppm2_git.stat.exists | default(false)

- name: Application directory for CI artifacts — {{ apppm2_app.key }}
  ansible.builtin.file:
    path: "{{ apppm2_dir }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  when: apppm2_app.value.process.type == 'artifact'

# Untracked runtime dirs (journals, logs, state): clone/CI never create them,
# and cron `>> data/logs/...` fails on the missing path (trade-lab, 2026-08-19).
- name: Runtime directories — {{ apppm2_app.key }}
  ansible.builtin.file:
    path: "{{ apppm2_dir }}/{{ item }}"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  loop: "{{ apppm2_app.value.process.dirs | default([]) }}"

# ── runtime ──
- name: Python venv — {{ apppm2_app.key }}
  ansible.builtin.command:
    cmd: "python3 -m venv {{ apppm2_app.value.process.venv | default('.venv') }}"
    chdir: "{{ apppm2_dir }}"
    creates: "{{ apppm2_dir }}/{{ apppm2_app.value.process.venv | default('.venv') }}"
  become: true
  become_user: "{{ admin_user }}"
  register: apppm2_venv
  when: apppm2_app.value.process.runtime | default('') == 'python'

# Marker, not `venv is changed`: one failed pip otherwise skips the install forever.
# The marker holds the sha256 of requirements.txt rather than just existing: a
# bare marker made a CHANGED requirements.txt invisible, so adding a dependency
# deployed an app that could not import it (GlucoseBot, anthropic, 2026-08).
# Content keeps the original property too — a failed pip writes no marker, so
# the install is retried rather than skipped forever.
- name: Hash the requirements — {{ apppm2_app.key }}
  ansible.builtin.stat:
    path: "{{ apppm2_dir }}/requirements.txt"
    checksum_algorithm: sha256
  register: apppm2_reqs
  when: apppm2_app.value.process.runtime | default('') == 'python'

# Absent marker = never installed; failed_when: false keeps that from being an
# error, and the default('') below reads it as "nothing installed yet".
- name: Read the venv install marker — {{ apppm2_app.key }}
  ansible.builtin.slurp:
    src: "{{ apppm2_dir }}/{{ apppm2_app.value.process.venv | default('.venv') }}/.pip-ok"
  register: apppm2_pip_ok
  failed_when: false
  when: apppm2_app.value.process.runtime | default('') == 'python'

- name: Pip install requirements — {{ apppm2_app.key }}
  ansible.builtin.command:
    cmd: "{{ apppm2_app.value.process.venv | default('.venv') }}/bin/pip install {{ apppm2_app.value.process.pip_args | default('-r requirements.txt') }}"
    chdir: "{{ apppm2_dir }}"
  become: true
  become_user: "{{ admin_user }}"
  changed_when: true
  register: apppm2_pip
  when:
    - apppm2_app.value.process.runtime | default('') == 'python'
    - apppm2_venv is changed
      or (apppm2_pip_ok.content | default('') | b64decode | trim)
         != (apppm2_reqs.stat.checksum | default(''))

- name: Mark the venv installed — {{ apppm2_app.key }}
  ansible.builtin.copy:
    dest: "{{ apppm2_dir }}/{{ apppm2_app.value.process.venv | default('.venv') }}/.pip-ok"
    content: "{{ apppm2_reqs.stat.checksum | default('') }}\n"
    mode: "0644"
  become: true
  become_user: "{{ admin_user }}"
  when: apppm2_pip is not skipped

# `npm: true` covers non-node runtimes that spawn node helpers from
# node_modules (askads: python backend spawns MCP servers per request).
# npm ci needs a lockfile; without one fall back to npm install.
- name: Check for a package lockfile — {{ apppm2_app.key }}
  ansible.builtin.stat:
    path: "{{ apppm2_dir }}/package-lock.json"
  register: apppm2_npm_lock
  when: >-
    apppm2_app.value.process.runtime | default('') == 'node'
    or apppm2_app.value.process.npm | default(false)

- name: Npm install — {{ apppm2_app.key }}
  ansible.builtin.command:
    cmd: "npm {{ 'ci' if apppm2_npm_lock.stat.exists | default(false) else 'install' }} --no-audit --no-fund"
    chdir: "{{ apppm2_dir }}"
    creates: "{{ apppm2_dir }}/node_modules"
  become: true
  become_user: "{{ admin_user }}"
  when: >-
    apppm2_app.value.process.runtime | default('') == 'node'
    or apppm2_app.value.process.npm | default(false)

# ── env files from the 1Password dotenv backups ──
# .env -> "dotenv <app>"; .env.en -> "dotenv <app>-en"; prod.env -> "dotenv <app>-prod"
# The pipe lookup strips trailing newlines — put exactly one back, or every
# host file (ending with \n, as text files do) reports a permanent diff.
# The newline must sit in a double-quoted YAML scalar: inside the folded `>-`
# block below it would be the two literal characters \ and n, which land in
# the file and corrupt the last variable's value (gistrec-cloud-bot, 2026-08-26).
#
# Restore-only: every op lookup runs in its own forked worker, which 1Password
# treats as a NEW client — one Touch ID per file, on every converge. Secrets
# flow host -> 1P (backup-envs.sh), so re-pulling existing files buys nothing;
# fetch only what is missing. -e apppm2_env_refresh=true forces the pull
# (deliberate 1P-wins restore). The per-item `when` is evaluated before the
# content lookup, so skipped files never invoke op.
- name: Check which env files already exist — {{ apppm2_app.key }}
  ansible.builtin.stat:
    path: "{{ apppm2_dir }}/{{ item }}"
  register: apppm2_env_stat
  loop: "{{ apppm2_app.value.env if apppm2_app.value.env is defined else ['.env'] }}"

- name: Env files from 1Password — {{ apppm2_app.key }}
  vars:
    apppm2_env_doc: >-
      {{ lookup('ansible.builtin.pipe',
                'op document get ' ~
                ('dotenv ' ~ apppm2_app.key ~
                 ('' if item.item == '.env' else '-' ~
                  (item.item | regex_replace('^\.env\.', '') | regex_replace('\.env$', ''))))
                | quote ~ ' --vault "Gistrec Cloud"') }}
  ansible.builtin.copy:
    content: "{{ apppm2_env_doc }}\n"
    dest: "{{ apppm2_dir }}/{{ item.item }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  loop: "{{ apppm2_env_stat.results }}"
  loop_control:
    label: "{{ item.item }}"
  when: apppm2_env_refresh | default(false) or not item.stat.exists
  no_log: true

# ── dashboard logins from the 1Password auth-users backups ──
# `auth_users: true` -> Document "auth-users <app>": hash lines the app reads
# per login (usage-beacon/fleet-auth/budget-explorer, hashes copy-compatible).
# Same restore-only contract as the env files above — the r1→r3 move lost
# them (runtime file outside git). Password change: edit on host + backup-envs.sh.
- name: Check the auth-users file — {{ apppm2_app.key }}
  ansible.builtin.stat:
    path: "{{ apppm2_dir }}/auth-users"
  register: apppm2_authusers
  when: apppm2_app.value.auth_users | default(false)

- name: Auth-users from 1Password — {{ apppm2_app.key }}
  vars:
    apppm2_authusers_doc: >-
      {{ lookup('ansible.builtin.pipe',
                'op document get ' ~ ('auth-users ' ~ apppm2_app.key) | quote
                ~ ' --vault "Gistrec Cloud"') }}
  ansible.builtin.copy:
    content: "{{ apppm2_authusers_doc }}\n"
    dest: "{{ apppm2_dir }}/auth-users"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0600"
  when:
    - apppm2_app.value.auth_users | default(false)
    - apppm2_env_refresh | default(false) or not apppm2_authusers.stat.exists
  no_log: true

# After env restore: a Next.js build bakes NEXT_PUBLIC_* and `prisma generate`
# reads the datasource. shell (not command): build strings chain with && / |.
# Idempotent via build_creates (e.g. .next) so it fires on a cold host /
# migration, not every converge — CI owns rebuilds.
- name: Build after install — {{ apppm2_app.key }} # noqa: command-instead-of-shell
  ansible.builtin.shell:
    cmd: "{{ apppm2_app.value.process.build }}"
    chdir: "{{ apppm2_dir }}"
    creates: >-
      {{ (apppm2_dir ~ '/' ~ apppm2_app.value.process.build_creates)
         if apppm2_app.value.process.build_creates is defined else omit }}
  become: true
  become_user: "{{ admin_user }}"
  changed_when: true
  when: apppm2_app.value.process.build is defined

# One-shot DR bootstrap: rematerialise runtime data code cannot derive
# (trade-lab db-restore rebuilds data/journal from the MySQL mirror).
# `creates` is the idempotence gate — refuse entries without it, or the
# command would rerun every converge.
- name: Refuse bootstrap entries without a creates sentinel — {{ apppm2_app.key }}
  ansible.builtin.fail:
    msg: >-
      {{ apppm2_app.key }}: bootstrap '{{ item.name | default(item.command) }}'
      has no `creates`.
  loop: "{{ apppm2_app.value.process.bootstrap | default([]) }}"
  loop_control:
    label: "{{ item.name | default(item.command) }}"
  when: item.creates is not defined

- name: Bootstrap — {{ apppm2_app.key }} # noqa: command-instead-of-shell
  ansible.builtin.shell:
    cmd: "{{ item.command }}"
    chdir: "{{ apppm2_dir }}"
    creates: "{{ apppm2_dir }}/{{ item.creates }}"
  become: true
  become_user: "{{ admin_user }}"
  changed_when: true
  loop: "{{ apppm2_app.value.process.bootstrap | default([]) }}"
  loop_control:
    label: "{{ item.name | default(item.command) }}"

- name: Bin directory for control scripts — {{ apppm2_app.key }}
  ansible.builtin.file:
    path: "{{ apppm2_home }}/bin"
    state: directory
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  when: apppm2_app.value.control_scripts | default([]) | length > 0

- name: Control scripts for forced commands — {{ apppm2_app.key }}
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/files/bin/{{ item }}"
    dest: "{{ apppm2_home }}/bin/{{ item }}"
    owner: "{{ admin_user }}"
    group: "{{ admin_user }}"
    mode: "0755"
  loop: "{{ apppm2_app.value.control_scripts | default([]) }}"

# ── pm2 ──
- name: Check the ecosystem file — {{ apppm2_app.key }}
  ansible.builtin.stat:
    path: "{{ apppm2_dir }}/{{ apppm2_app.value.process.ecosystem | default('ecosystem.config.js') }}"
  register: apppm2_eco
  when: apppm2_app.value.process.pm2 | default([]) | length > 0

- name: Start missing pm2 processes — {{ apppm2_app.key }}
  ansible.builtin.command:
    cmd: >-
      pm2 startOrReload {{ apppm2_app.value.process.ecosystem | default('ecosystem.config.js') }}
      --only {{ apppm2_missing | join(',') }}
    chdir: "{{ apppm2_dir }}"
  become: true
  become_user: "{{ admin_user }}"
  changed_when: true
  vars:
    apppm2_missing: >-
      {{ apppm2_app.value.process.pm2 | default([])
         | difference(apppm2_current_processes) }}
  when:
    - apppm2_app.value.process.pm2 | default([]) | length > 0
    - apppm2_eco.stat.exists | default(false)
    - apppm2_missing | length > 0
  notify: Save pm2 process list

# The task above only starts what is MISSING, so a process that is already
# running keeps its old code in memory: a pulled repo and a reinstalled venv
# would sit on disk unused until somebody restarted it by hand. Reload exactly
# when something it runs actually changed — not on every converge, which would
# bounce every app on the host for nothing.
- name: Reload pm2 after a code or dependency change — {{ apppm2_app.key }}
  ansible.builtin.command:
    cmd: >-
      pm2 startOrReload {{ apppm2_app.value.process.ecosystem | default('ecosystem.config.js') }}
      --only {{ apppm2_app.value.process.pm2 | join(',') }}
    chdir: "{{ apppm2_dir }}"
  become: true
  become_user: "{{ admin_user }}"
  changed_when: true
  when:
    - apppm2_app.value.process.pm2 | default([]) | length > 0
    - apppm2_eco.stat.exists | default(false)
    - (apppm2_pull is defined and apppm2_pull is changed)
      or (apppm2_pip is defined and apppm2_pip is changed)
  notify: Save pm2 process list

- name: Warn when pm2 apps are declared without an ecosystem file — {{ apppm2_app.key }}
  ansible.builtin.debug:
    msg: >-
      {{ apppm2_app.key }}: pm2 processes {{ apppm2_app.value.process.pm2 }} declared but
      {{ apppm2_app.value.process.ecosystem | default('ecosystem.config.js') }} is
      missing in {{ apppm2_dir }} — add one to the app repo.
  when:
    - apppm2_app.value.process.pm2 | default([]) | length > 0
    - not (apppm2_eco.stat.exists | default(false))
