---
# Shared Docker Engine bootstrap for roles that own Compose services. Callers
# retain their package-list knobs and pass the selected list explicitly.
- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Add Docker's official GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

# apt_repository-era file — with the .sources below both would duplicate the source.
- name: Remove the pre-deb822 Docker source
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Install python3-debian (deb822_repository needs it)
  ansible.builtin.apt:
    name: python3-debian
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Add Docker apt repository
  ansible.builtin.deb822_repository:
    name: docker
    uris: https://download.docker.com/linux/ubuntu
    suites: "{{ ansible_facts.distribution_release }}"
    components: stable
    architectures: "{{ 'amd64' if ansible_facts.architecture == 'x86_64' else ansible_facts.architecture }}"
    signed_by: /etc/apt/keyrings/docker.asc
    state: present

# present, not latest: engine upgrades stay deliberate (apt on the host).
- name: Install Docker Engine and the compose plugin
  ansible.builtin.apt:
    name: "{{ docker_runtime_packages }}"
    state: present
    update_cache: true

- name: Enable and start Docker
  ansible.builtin.service:
    name: docker
    enabled: true
    state: started
