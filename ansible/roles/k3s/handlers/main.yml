---
# config.yaml читается только при старте, поэтому без этого правка тихо не
# применялась бы до ближайшей перезагрузки. Апи-сервер недоступен пару секунд;
# поды переживают — containerd рестарт не трогает.
- name: Restart k3s
  ansible.builtin.service:
    name: k3s
    state: restarted
  # Юнита ещё нет при первой установке — а systemd-модуль проверяет его наличие
  # ДО ветки check_mode, так что без этого `make check` на новом хосте падал бы
  # вместо отчёта. На первой установке рестарт и не нужен: конфиг пишется до
  # установщика, и стартующий k3s читает его сам.
  when: k3s_binary.stat.exists
