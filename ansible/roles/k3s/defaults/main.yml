---
k3s_managed: false

# Пустая = канал stable на момент установки. Установщик не трогает уже стоящий
# бинарь (creates:), так что версия фиксируется фактом первой установки; для
# воспроизводимого апгрейда задать явную в host_vars.
k3s_version: ""

# Адрес, под которым узел живёт для внешнего мира: сертификат, kubeconfig,
# node-ip. НЕ bind-address — см. README, сокет намеренно остаётся на 0.0.0.0.
k3s_node_ip: ""

k3s_api_port: 6443
k3s_cluster_cidr: 10.42.0.0/16
k3s_service_cidr: 10.43.0.0/16

# Дополнительные имена в сертификате апи-сервера, помимо k3s_node_ip. Нужны,
# когда до API ходят не по его адресу: через ssh -L это 127.0.0.1, и без SAN
# kubectl упрётся в несовпадение имени.
k3s_tls_san_extra: []

# traefik занял бы 80/443, servicelb — произвольные порты на всех адресах.
# На хосте, который делим с чужим сервисом, оба недопустимы.
k3s_disable:
  - traefik
  - servicelb

# Кто дотянется до API с публичных адресов. Пустой список = никто: ufw-правила
# не заводятся, и дефолтный deny хоста оставляет порт закрытым.
k3s_api_allow_from: []

# Интерфейс, с которого API доступен без оглядки на адрес источника — меш.
# Предпочтительный способ: allow-лист по динамическому домашнему IP живёт до
# первой смены адреса, а в тоннеле источник вообще не важен.
k3s_api_allow_interface: ""

# Адреса, у которых доступ отзывается. Модуль ufw не сверяет состояние, поэтому
# удаление из k3s_api_allow_from само по себе правило не снимает — его надо
# назвать здесь. Запись остаётся в host_vars как след: «этим когда-то было
# можно, проверяем, что больше нельзя».
k3s_api_revoke_from: []

# Чужой swap не выключаем — kubelet переживает его наличие с этим флагом.
k3s_fail_swap_on: false

# Диапазон NodePort, открываемый на интерфейсе меша. Ingress-контроллера нет и
# не будет (80/443 заняты чужим сервисом), поэтому до сервисов ходят так:
# nginx на публичном хосте проксирует на <адрес узла в меше>:<NodePort> —
# тот же приём, что у *-rf вхостов. Пусто = не открывать.
k3s_nodeport_interface: ""
k3s_nodeport_range: "30000:32767"
