---
# Скаляр вместо списка Jinja перебрала бы посимвольно, и «127.0.0.1» дало бы
# десять SAN из цифр и точек. YAML при этом валиден, так что ни check-yaml, ни
# сам k3s не возразили бы.
- name: Require k3s_tls_san_extra to be a list
  ansible.builtin.assert:
    that: k3s_tls_san_extra is sequence and k3s_tls_san_extra is not string
    fail_msg: "k3s_tls_san_extra must be a list, got {{ k3s_tls_san_extra | type_debug }}"

- name: Require an explicit node address
  ansible.builtin.assert:
    that: k3s_node_ip | length > 0
    fail_msg: >-
      k3s_node_ip must be set — it becomes the certificate SAN, the kubeconfig
      endpoint and the ufw destination. Guessing it would publish the API on
      whichever address the installer picked.

- name: Check whether k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_binary
  check_mode: false

# Подсети подов и сервисов живут в общей таблице маршрутизации. На хосте, где
# уже есть чей-то VPN, совпадение увело бы чужой трафик в кластер.
#
# Только до установки: потом маршруты в этих подсетях создаёт сам кластер
# (cni0, flannel.1), и проверка начала бы ловить саму себя — второй прогон
# роли падал.
#
# Скриптом, а не сравнением строк: маршрут 10.0.0.0/8 содержит обе подсети, но
# подстроки «10.42.» в нём нет — именно такой маршрут и бывает у чужого VPN,
# ради которого проверка затевалась. Промах в обратную сторону тоже реален:
# адрес 110.42.0.1 содержит подстроку и блокировал бы свободную подсеть.
- name: Refuse to overlap an existing route
  ansible.builtin.script:
    cmd: check-cidr-overlap.py {{ k3s_cluster_cidr | quote }} {{ k3s_service_cidr | quote }}
    executable: python3
  changed_when: false
  # Читает и только читает: без этого --check пропустил бы проверку целиком.
  check_mode: false
  when: not k3s_binary.stat.exists

- name: Configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    owner: root
    group: root
    mode: "0700"

# Пишем ДО установки: установщик стартует k3s сразу, и без конфига первый запуск
# поднял бы traefik и раздал сертификат не на тот адрес.
- name: Render the k3s configuration
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    owner: root
    group: root
    mode: "0600"
  register: k3s_config
  notify: Restart k3s

- name: Fetch the installer
  ansible.builtin.get_url:
    url: https://get.k3s.io
    dest: /usr/local/share/k3s-install.sh
    owner: root
    group: root
    mode: "0700"

- name: Install k3s
  ansible.builtin.command:
    cmd: /usr/local/share/k3s-install.sh
  environment:
    INSTALL_K3S_SKIP_SELINUX_RPM: "true"
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
  args:
    creates: /usr/local/bin/k3s

# ── ufw ──
# Хост держит default deny incoming и FORWARD DROP, и мы их не трогаем: правила
# ниже точечные. Без route-правил flannel дописал бы свои ACCEPT в конец
# FORWARD, а `ufw reload` их снёс бы — сломав наши поды, не чужой сервис.
- name: Allow pod traffic out through the FORWARD chain
  community.general.ufw:
    rule: allow
    route: true
    src: "{{ k3s_cluster_cidr }}"

- name: Allow pod traffic in through the FORWARD chain
  community.general.ufw:
    rule: allow
    route: true
    dest: "{{ k3s_cluster_cidr }}"

# Сокет апи-сервера намеренно на 0.0.0.0 (см. README). Ограничение — здесь.
- name: Allow the API port over the mesh interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ k3s_api_allow_interface }}"
    to_port: "{{ k3s_api_port | string }}"
    proto: tcp
    comment: "k3s API over the mesh (ansible)"
  when: k3s_api_allow_interface | length > 0

# dest пинит адрес, так что на соседском IP порт остаётся закрытым и здесь.
- name: Allow the API port from operator addresses
  community.general.ufw:
    rule: allow
    src: "{{ item }}"
    dest: "{{ k3s_node_ip }}"
    port: "{{ k3s_api_port | string }}"
    proto: tcp
    comment: "k3s API (ansible)"
  loop: "{{ k3s_api_allow_from }}"

- name: Allow NodePort services over the mesh interface
  community.general.ufw:
    rule: allow
    direction: in
    interface: "{{ k3s_nodeport_interface }}"
    to_port: "{{ k3s_nodeport_range }}"
    proto: tcp
    comment: "k3s NodePort over the mesh (ansible)"
  when: k3s_nodeport_interface | length > 0

- name: Revoke API access the mesh replaced
  community.general.ufw:
    rule: allow
    delete: true
    src: "{{ item }}"
    dest: "{{ k3s_node_ip }}"
    port: "{{ k3s_api_port | string }}"
    proto: tcp
    # Та же форма правила, что у allow выше, включая comment: ufw сверяет
    # запрос на удаление с разобранным кортежем, и правило с комментарием по
    # запросу без него может не найтись — а `ufw delete` на несуществующее
    # правило выходит с нулём, так что отзыв «прошёл бы», ничего не сняв.
    comment: "k3s API (ansible)"
  loop: "{{ k3s_api_revoke_from }}"

# Падение ЛЮБОЙ последующей роли отменяет отложенный рестарт, и конфиг на диске
# остаётся новее процесса — молча, до ближайшей перезагрузки. На следующем
# прогоне шаблон уже совпадает, notify не срабатывает, и расхождение
# закрепляется. Так уже обжигались в nginx (дважды) и в mysql — флашим здесь.
- name: Apply the pending k3s restart now
  ansible.builtin.meta: flush_handlers
