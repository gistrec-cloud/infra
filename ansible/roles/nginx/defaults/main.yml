---
# List of reverse-proxy vhosts; usually set per host in host_vars/.
# Each item: { server_name, upstream_port, tls (bool, optional) }
nginx_sites: []

# Set certbot_email (e.g. in host_vars) to enable Let's Encrypt issuance.

# Двусторонние имена: geo_registry (group_vars/all.yml ← geo.json). Хост, не
# несущий приложение, получает отсюда сгенерированный прокси-фронт.
nginx_geo: "{{ geo_registry }}"
nginx_geo_front_max_body_size: 100m
nginx_geo_front_timeout: 300s

# htpasswd files the verbatim vhosts reference (auth_basic_user_file):
# path → content, vault refs in the gitignored inventory (all: vars:), e.g.
#   /etc/nginx/.htpasswd: "{{ vault_htpasswd_stats }}"
# Nothing else recreates them, and nginx -t passes without the file (opened
# per request) — a rebuilt host would serve 500s to every authed request.
nginx_htpasswd_files: {}

# alert-feed.json парента (netdata_alert_feed_dir, пишет status-snapshot) —
# данные для команд /alerts и /status бота алертов на другом хосте. Адреса, с
# которых его можно читать, — wg-IP хоста бота: location в health.conf
# отвечает только им (allow/deny по адресу источника), остальным 403. Пусто или
# без netdata_alert_feed_dir — location нет.
nginx_alert_feed_allow: []
