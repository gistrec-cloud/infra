# Монитораемый TCP-порт перестал принимать соединения.
#
# Нужен потому, что штатный portcheck_service_reachable уходит `to: silent` —
# сам по себе он не уведомляет никого, и «порт молча умер» осталось бы
# незамеченным. Тот же случай, что был с заполняющимся диском.
#
# crit, а не warn: телеграм-фильтр парка пропускает только |critical.
#
# Порог по среднему за минуту, а не по последней пробе: одиночный промах (ре-
# коннект wg, рестарт сервиса) не должен поднимать тревогу, а устойчивая
# недоступность должна. При every 10s и delay up 1m аларм приходит через
# ~1.5–2 минуты после реального падения.
#
# Шаблон намеренно БЕЗ фильтра по метке: portcheck в парке используется только
# там, где порт нам важен, так что любое его падение заслуживает crit. Поэтому
# же тут нет ни одного номера порта — цели живут в host_vars.
#
# Caveat: health поднимает алармы примерно через минуту ПОСЛЕ старта netdata;
# опрос API раньше даёт ложный отрицательный ответ.
 template: portcheck_port_down
       on: portcheck.status
    class: Availability
     type: System
component: TCP endpoint
   lookup: average -1m unaligned percentage of success
    units: %
    every: 10s
     crit: $this < 50
    delay: up 1m down 5m
  summary: TCP ${label:host}:${label:port} is down
     info: TCP ${label:host} port ${label:port} refused or timed out for the last minute
       to: sysadmin
