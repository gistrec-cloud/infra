# Early disk-fill warning, addressed to the `disk` role so it escapes the
# fleet-wide `|critical` Telegram filter (health_alarm_notify.conf.j2).
#
# The stock disk_space_usage already warns at 80%, but it is `to: sysadmin`,
# falls into DEFAULT_RECIPIENT_TELEGRAM and its WARNING is filtered out — so in
# practice the fleet only hears about a disk at CRITICAL, which the stock alarm
# gates behind `$avail < 5` GB. On finland-01's 75 GB root that is ~93% full:
# on 2026-08-13 the first Telegram message arrived when the disk was already at
# 100% and MySQL had stopped writing ("Disk is full writing ./mysql-bin.000011").
#
# This alarm is deliberately WARNING-only and does not touch the stock one: the
# CRITICAL path is unchanged, this just adds an earlier, quieter heads-up.
# 85% leaves ~11 GB of headroom on a 75 GB disk — room to look before anything
# breaks on a normal fill (logs, dumps, images). A runaway query filling 52 GB
# in minutes will still outrun it; that class of failure is bounded at the
# database instead (mysql role, init_connect + max_execution_time).
#
# Installed on the notifying evaluator only (parent or standalone) — the parent
# already evaluates streamed child charts, so installing on children too would
# double-notify. Same rule as pm2/oom alarms in this role.

    template: disk_space_early
          on: disk.space
       class: Utilization
        type: System
   component: Disk
chart labels: mount_point=!/dev !/dev/* !/run !/run/* !HarddiskVolume* *
        calc: $used * 100 / ($avail + $used)
       units: %
       every: 1m
        warn: $this > 85
       delay: up 2m down 30m multiplier 1.5 max 1h
     summary: Disk ${label:mount_point} is filling up
        info: Early warning — disk ${label:mount_point} is over 85% full. \
              Check for runaway logs, unrotated dumps or temp files before it \
              reaches the CRITICAL threshold and writes start failing.
          to: disk
