# Перекрывает стоковый health.d/swap.conf (одноимённый файл в /etc/netdata
# отменяет стоковый). Стоковый used_swap горит по занятости свопа, а забитый
# холодными страницами своп — норма: finland-01 2026-10-25 держал CRITICAL на
# 100% при si≈0 и ≥1.6 GB available. Беда — это активная подкачка, её и ловим.
# Нехватку RAM добивает oom_kill_notify.
    alarm: swap_in_thrashing
       on: mem.swapio
host labels: _os=linux
   lookup: average -10m unaligned absolute of in
    units: KiB/s
    every: 1m
     crit: $this > 2048
    delay: down 15m multiplier 1.5 max 1h
  summary: System swapping in
     info: average swap-in rate over the last 10 minutes; sustained swap-in means RAM is short
       to: sysadmin
