# Reverse side of fleet-link.conf: finland-01 pings russia-03 (go.d ping jobs
# uplink_* in host_vars — wg tunnel IP + public IP). Deployed ONLY on
# finland-01, as ping.conf ON PURPOSE: shadows the stock ping alarms, and the
# uplink_* prefix keeps the parent's fleet-link.conf off these charts when
# they stream — evaluated here so alerts still fire when the link (and thus
# streaming) is down, exactly like fleet-watch.conf. Telegram-only (`link`).
    template: uplink_host_unreachable
          on: ping.host_packet_loss
chart labels: _collect_job=uplink_*
       class: Errors
        type: Other
   component: Network
      lookup: average -30s unaligned of loss
        calc: ($this == nan) ? (nan) : ($this < 100)
       units: up/down
       every: 10s
        crit: $this == 0
       delay: down 5m multiplier 1.5 max 1h
          to: link
        info: uplink probe ${label:host} is fully unreachable (100% packet loss) for 30s

    template: uplink_packet_loss
          on: ping.host_packet_loss
chart labels: _collect_job=uplink_*
       class: Errors
        type: Other
   component: Network
      lookup: average -10m unaligned of loss
       units: %
       every: 10s
        warn: $this > 5
        crit: $this > 10
       delay: down 30m multiplier 1.5 max 2h
          to: link
        info: packet loss to uplink probe ${label:host} over the last 10 minutes

    template: uplink_latency
          on: ping.host_rtt
chart labels: _collect_job=uplink_*
       class: Latency
        type: Other
   component: Network
      lookup: average -1m unaligned of avg
       units: ms
       every: 10s
        warn: $this > 100
        crit: $this > 500
       delay: down 30m multiplier 1.5 max 2h
          to: link
        info: average RTT to uplink probe ${label:host} over the last minute
