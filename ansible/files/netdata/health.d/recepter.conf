# recepter (edalle.ru): бекенд api.edalle.ru (8000) и админка admin.edalle.ru
# (9100). Обе /health-пробы — bounded SELECT 1 к MySQL → 503.
#
# Третья джоба, recepter_admin_login, дёргает настоящую страницу с рендером
# шаблона. 2026-09-17 админка 500-ла на каждой странице при живом процессе и
# здоровой базе (Starlette 1.x выбросил старую сигнатуру TemplateResponse) —
# ни pm2_app_down, ни /health такое не видят. Разделение даёт причину прямо в
# тексте алерта: health красный — база, login при зелёном health — приложение.

# Бекенд — единственная точка входа мобильного приложения, поэтому fleetcrit.
    template: recepter_backend_health_down
          on: httpcheck.status
chart labels: _collect_job=recepter_backend
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: fleetcrit
        info: recepter backend /health is failing (503, refused, or timeout) for 1m

# Админка — внутренний инструмент, простой терпимый, поэтому sysadmin.
# Шаблон накрывает обе её пробы: recepter_admin (/health) и
# recepter_admin_login (/login, рендер шаблона).
    template: recepter_admin_down
          on: httpcheck.status
chart labels: _collect_job=recepter_admin*
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: recepter ${label:_collect_job} is failing (5xx, refused, or timeout) for 1m
