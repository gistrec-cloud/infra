# recepter (edalle.ru): бекенд api.edalle.ru (8000) и админка admin.edalle.ru
# (9100). Обе пробы — bounded SELECT 1 к MySQL (asyncio.wait_for 3s в
# common/database/health.py) → 503, поэтому алармом служит success<1.
#
# Зачем тут три джобы, а не одна на приложение. 2026-09-17 админка 500-ла на
# каждой странице при живом процессе и здоровой базе: Starlette 1.x выбросил
# старую сигнатуру TemplateResponse. pm2_app_down такое не видит по
# определению, и /health бы тоже не увидел — база-то отвечала. Ловит это
# только recepter_admin_login, который дёргает настоящую страницу с рендером
# шаблона. Держать её отдельно от /health стоит ради причины в тексте алерта:
# health красный — беда с базой, login красный при зелёном health — беда с
# самим приложением.
#
# delay up 5m: база живёт на finland-01 за wg, так что флап RF↔EU поднимает обе
# health-пробы разом — причину приносит link_host_unreachable, а сюда попадает
# только затяжная недоступность.

# Бекенд — единственная точка входа мобильного приложения, поэтому fleetcrit.
    template: recepter_backend_health_down
          on: httpcheck.status
chart labels: _collect_job=recepter_backend
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: fleetcrit
        info: recepter backend /health is failing (503, refused, or timeout) for 1m

# Админка — внутренний инструмент, простой терпимый, поэтому sysadmin.
# Шаблон накрывает обе её пробы: recepter_admin (/health) и
# recepter_admin_login (/login, рендер шаблона).
    template: recepter_admin_down
          on: httpcheck.status
chart labels: _collect_job=recepter_admin*
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: recepter ${label:_collect_job} is failing (5xx, refused, or timeout) for 1m
