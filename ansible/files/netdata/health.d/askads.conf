# askads /api/health. Two deployments of identical code: askads-ru on
# russia-03:8077 and askads-cloud on finland-01:8078 (streamed here). Both
# return 503 on a failed MySQL SELECT 1, so success<1 is the alarm.
# Jobs listed explicitly, not as askads_*: that glob would also swallow the
# askads_mcp_* jobs below and fire both templates on one event.
    template: askads_health_down
          on: httpcheck.status
chart labels: _collect_job=askads_ru askads_cloud
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: askads ${label:_collect_job} /api/health is failing (503, refused, or timeout) on half the probes over 2m

# Deep MCP probe: the app spawns the real mcp-yandex-direct and requires a
# non-empty tools/list. Catches "Python alive, node_modules gone" — 21.07–11.08
# 2026 every tools/list crashed MODULE_NOT_FOUND for three weeks behind 200s.
# lookup -3m because the app caches the probe 60s: one transient spawn failure
# poisons a full minute of samples (a third of the window). No wg hop, no `up` delay.
    template: askads_mcp_down
          on: httpcheck.status
chart labels: _collect_job=askads_mcp_*
       class: Errors
        type: Web Server
   component: MCP subprocess
      lookup: average -3m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 2m multiplier 1.5 max 1h
          to: botcrit
        info: askads ${label:_collect_job} /api/health/mcp is failing — the mcp-yandex-direct spawn or tools/list is broken

# Upstream Yandex Direct API, probed by the app with a tokenless request (no
# quota): healthy = JSON error 53, outage = HTTP 204 with an empty body. On
# 11.10.2026 Direct answered 204 for three days while askads_mcp_* stayed green —
# tools/list never reaches the API. External outage, nothing to fix on our side,
# so a long `down` delay and sysadmin, not botcrit.
    template: askads_direct_api_down
          on: httpcheck.status
chart labels: _collect_job=askads_direct_ru
       class: Errors
        type: Web Server
   component: Yandex Direct API
      lookup: average -5m unaligned of success
       units: ok
       every: 30s
        crit: $this < 0.5
       delay: down 5m multiplier 1.5 max 6h
          to: sysadmin
        info: Yandex Direct API is unavailable (204/empty, 5xx or timeout) on half the probes over 5m — Direct tools in chat, gateway and Watchdog fail
