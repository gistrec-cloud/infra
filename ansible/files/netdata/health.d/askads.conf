# askads /api/health alarms. Two deployments run identical code: askads-ru on
# russia-01:8077 (job askads_ru, local) and askads-cloud on finland-01:8078
# (job askads_cloud, streamed here). Both httpcheck jobs return 503 when the
# app's MySQL SELECT 1 fails, so success<1 is the alarm. Deployed on the netdata
# parent ONLY: it evaluates the streamed askads_cloud chart too, so binding the
# jobs here covers both without finland double-notifying.
# NOTE: shallow jobs are listed explicitly — the old askads_* pattern would also
# match the askads_mcp_* jobs of the deep template below and double-notify.
    template: askads_health_down
          on: httpcheck.status
chart labels: _collect_job=askads_ru askads_cloud
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: askads ${label:_collect_job} /api/health is failing (503, refused, or timeout) for 1m

# Deep MCP-layer probe (/api/health/mcp, jobs askads_mcp_ru + askads_mcp_cloud):
# the app spawns the real mcp-yandex-direct and requires a non-empty tools/list.
# Catches "Python alive, node_modules gone" — the 21.07–11.08.2026 silent outage
# (every tools/list crashed MODULE_NOT_FOUND for three weeks behind HTTP 200s).
# lookup -2m: the app caches the probe for 60s, so one transient spawn failure
# poisons a full minute of httpcheck samples; two minutes of zero successes
# means it is really down. to: botcrit — pages via Pushover, same escalation as
# the ClearTranscriptBot/Loquia deep probes.
    template: askads_mcp_down
          on: httpcheck.status
chart labels: _collect_job=askads_mcp_*
       class: Errors
        type: Web Server
   component: MCP subprocess
      lookup: max -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: down 2m multiplier 1.5 max 1h
          to: botcrit
        info: askads ${label:_collect_job} /api/health/mcp is failing — the mcp-yandex-direct spawn or tools/list is broken
