# Ребёнок перестал стримить паренту. Правила живут только у парента, а дети шлют
# лишь link/fleetcrit, так что без стрима его чарты молча становятся пустыми —
# ни один алерт по ним не загорится. Стоковый streaming_disconnected — warn и
# to: silent. Выведенный из парка хост держит тревогу, пока его не уберут:
#   netdatacli remove-stale-node <hostname>
    template: fleet_streaming_lost
          on: netdata.streaming_inbound
chart labels: type=permanent
       class: Availability
        type: Streaming
   component: Streaming
        calc: ${stale disconnected}
       units: nodes
       every: 10s
        crit: $this > 0
       delay: up 5m down 5m multiplier 1.5 max 1h
          to: sysadmin
        info: a child stopped streaming to the parent for 5m — its alarms are blind (netdata down, wg down, or a retired host to remove)
