# RF↔EU link quality: russia-03 pings finland-01 over both paths (go.d ping
# jobs link_* in host_vars — wg tunnel IP + public IP; a diverging pair means
# the tunnel is throttled, not the route). Deployed as ping.conf ON PURPOSE:
# it shadows the stock ping alarms (LAN thresholds, sysadmin role) — and keeps
# the parent from also alarming on finland-01's streamed uplink_* charts,
# which finland-01 evaluates itself (fleet-uplink.conf, same reason as
# health_*/watch_*). Total loss also fires fleet_health_down (fleetcrit →
# Pushover); these stay on the unmapped `link` role = Telegram-only.
    template: link_host_unreachable
          on: ping.host_packet_loss
chart labels: _collect_job=link_*
       class: Errors
        type: Other
   component: Network
      lookup: average -30s unaligned of loss
        calc: ($this == nan) ? (nan) : ($this < 100)
       units: up/down
       every: 10s
        crit: $this == 0
       delay: down 5m multiplier 1.5 max 1h
          to: link
        info: link probe ${label:host} is fully unreachable (100% packet loss) for 30s

# Sustained loss = the link is degrading long before probes fail outright.
# Baseline is 0%; WARNING is dashboard-only (the |critical Telegram filter).
    template: link_packet_loss
          on: ping.host_packet_loss
chart labels: _collect_job=link_*
       class: Errors
        type: Other
   component: Network
      lookup: average -10m unaligned of loss
       units: %
       every: 10s
        warn: $this > 5
        crit: $this > 10
       delay: down 30m multiplier 1.5 max 2h
          to: link
        info: packet loss to link probe ${label:host} over the last 10 minutes

# Baseline SPb↔Helsinki is ~5-15ms; 100ms sustained = reroute or bufferbloat
# (dashboard-only WARNING), 500ms = the link is effectively unusable.
    template: link_latency
          on: ping.host_rtt
chart labels: _collect_job=link_*
       class: Latency
        type: Other
   component: Network
      lookup: average -1m unaligned of avg
       units: ms
       every: 10s
        warn: $this > 100
        crit: $this > 500
       delay: down 30m multiplier 1.5 max 2h
          to: link
        info: average RTT to link probe ${label:host} over the last minute
