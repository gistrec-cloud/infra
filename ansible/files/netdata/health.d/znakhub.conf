# znakhub (apps.yml: znakhub, репо 101edok/znakhub; исходник — deploy/netdata/znakhub.conf
# в репо, держать в синхроне): интеграция с API Честного знака на russia-03.
# Метрики: /metrics API (job znakhub, 127.0.0.1:8120) и worker'а (job znakhub_worker,
# 127.0.0.1:8121) — netdata_prometheus_jobs в host_vars/russia-03.yml. Имена job'ов
# несущие: на них завязаны строки `on: prometheus.<job>.*` ниже.

# Worker не крутит цикл: выгрузки встали целиком.
 template: znakhub_worker_stalled
       on: prometheus.znakhub_worker.znakhub_worker_last_loop_timestamp
    class: Errors
     type: Data Collection
component: znakhub
     calc: $now - $znakhub_worker_last_loop_timestamp
    units: seconds
    every: 1m
     crit: $this > 300
    delay: down 10m multiplier 1.5 max 1h
     info: znakhub: worker не делал ни одного цикла больше 5 минут — выгрузки из ЧЗ стоят
       to: botcrit

# znakhub_chz_errors_last_hour — три графика (метка kind), у каждого одно измерение:
# график выбираем по метке, а не по имени измерения.

# Токен ЧЗ истёк или отозван: все вызовы падают с 401, выгрузки ждут нового токена.
 template: znakhub_chz_auth_failing
       on: prometheus.znakhub.znakhub_chz_errors_last_hour
    class: Errors
     type: Data Collection
component: znakhub
chart labels: kind=auth
   lookup: max -2m unaligned
    units: errors
    every: 1m
     crit: $this > 0
    delay: down 15m multiplier 1.5 max 2h
     info: znakhub: ЧЗ отвечает 401 — токен истёк, обновите ZH_CHZ_TOKEN (позже — signer)
       to: botcrit

# Упираемся в лимиты ЧЗ. Единичные 429 — норма (лимитер их переживает), поток — нет.
 template: znakhub_chz_rate_limited
       on: prometheus.znakhub.znakhub_chz_errors_last_hour
    class: Latency
     type: Data Collection
component: znakhub
chart labels: kind=rate_limited
   lookup: max -2m unaligned
    units: errors
    every: 1m
     warn: $this > 20
    delay: down 30m multiplier 1.5 max 2h
     info: znakhub: больше 20 ответов 429 от ЧЗ за час — лимиты ниже документированных или квоту делит другая система
       to: sysadmin

# ЧЗ лежит или тормозит: 5xx и сетевые ошибки.
 template: znakhub_chz_server_errors
       on: prometheus.znakhub.znakhub_chz_errors_last_hour
    class: Errors
     type: Data Collection
component: znakhub
chart labels: kind=server
   lookup: max -2m unaligned
    units: errors
    every: 1m
     warn: $this > 10
     crit: $this > 50
    delay: down 30m multiplier 1.5 max 2h
     info: znakhub: ЧЗ отвечает 5xx/таймаутами — сервис ЧЗ деградировал (проверьте «Пульс маркировки»)
       to: sysadmin

# Выгрузки падают или приходят с ошибками внутри CSV (COMPLETED, но данных нет из-за ошибки).
 template: znakhub_exports_failing
       on: prometheus.znakhub.znakhub_export_jobs_failed_24h
    class: Errors
     type: Data Collection
component: znakhub
   lookup: max -2m unaligned
    units: jobs
    every: 5m
     warn: $this > 0
    delay: down 1h
     info: znakhub: за сутки есть упавшие выгрузки — смотрите экран «Выгрузки», поле error
       to: sysadmin

 template: znakhub_exports_csv_errors
       on: prometheus.znakhub.znakhub_export_jobs_error_outcome_24h
    class: Errors
     type: Data Collection
component: znakhub
   lookup: max -2m unaligned
    units: jobs
    every: 5m
     warn: $this > 0
    delay: down 1h
     info: znakhub: ЧЗ вернул ошибки внутри CSV — вероятно, поменялся формат параметров выгрузки
       to: sysadmin
