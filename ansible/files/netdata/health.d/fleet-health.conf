# Fleet liveness: the parent probes every peer's nginx /health over wg0 (jobs
# health_*). One probe covers host + nginx + tunnel at once. Exists because the
# stock httpcheck_web_service_up template is `to: silent` and never notifies.
# finland-01 watches the parent back on the watch_* prefix — see fleet-watch.conf.
    template: fleet_health_down
          on: httpcheck.status
chart labels: _collect_job=health_*
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: fleetcrit
        info: fleet /health probe ${label:url} is failing (down, refused, or timeout) for 1m
