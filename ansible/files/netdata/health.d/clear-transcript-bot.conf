    template: clear_transcript_bot_healthcheck
          on: httpcheck.status
chart labels: _collect_job=cleartranscript
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 2m multiplier 1.5 max 1h
          to: botcrit
        info: ClearTranscriptBot /healthcheck is failing (HTTP 503, refused, or timeout) on half the probes over 2m
