    template: clear_transcript_bot_healthcheck
          on: httpcheck.status
chart labels: _collect_job=cleartranscript
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 2m multiplier 1.5 max 1h
          to: botcrit
        info: ClearTranscriptBot /healthcheck is failing (HTTP 503, refused, or timeout) on half the probes over 2m

    template: clear_transcript_bot_slow
          on: httpcheck.response_time
chart labels: _collect_job=cleartranscript
       class: Latency
        type: Web Server
   component: HTTP endpoint
      lookup: median -5m unaligned of time
       units: ms
       every: 30s
        warn: $this > 300
        crit: $this > 1000
       delay: down 5m multiplier 1.5 max 1h
          to: sysadmin
        info: ClearTranscriptBot /healthcheck (two MySQL round-trips on the bot event loop) median over 5m is slow: DB or event loop lagging, users wait for replies. Median, not average: httpcheck records time=0 for timed-out probes; past 50% timeouts clear_transcript_bot_healthcheck fires instead

# Тихие проверки /alerts/<имя>: бот жив, но у пользователей что-то ломается.
# Только bad_status (бот ответил 503): недоступность и таймаут ловит
# clear_transcript_bot_healthcheck, второй алерт о лежащем боте не нужен.
# crit, а не warn: получатель по умолчанию пропускает в Telegram только CRITICAL.
# Имя не кончается на _healthcheck — это не простой для статус-страницы и чатов.
    template: clear_transcript_bot_failure_spike
          on: httpcheck.status
chart labels: _collect_job=clear_transcript_bot_failure_spike
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of bad_status
       units: status
       every: 30s
        crit: $this > 0.5
       delay: down 15m multiplier 1.5 max 1h
          to: sysadmin
        info: ClearTranscriptBot: одна причина сбоя (скачивание, конвертация, старт распознавания, провайдер) за час задела 2+ пользователей — curl 127.0.0.1:9010/alerts/failure_spike на finland-01 покажет какая
