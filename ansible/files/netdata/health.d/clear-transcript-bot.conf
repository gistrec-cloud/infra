    template: clear_transcript_bot_healthcheck
          on: httpcheck.status
chart labels: _collect_job=cleartranscript
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 2m multiplier 1.5 max 1h
          to: botcrit
        info: ClearTranscriptBot /healthcheck is failing (HTTP 503, refused, or timeout) on half the probes over 2m

    template: clear_transcript_bot_slow
          on: httpcheck.response_time
chart labels: _collect_job=cleartranscript
       class: Latency
        type: Web Server
   component: HTTP endpoint
      lookup: median -5m unaligned of time
       units: ms
       every: 30s
        warn: $this > 300
        crit: $this > 1000
       delay: down 5m multiplier 1.5 max 1h
          to: sysadmin
        info: ClearTranscriptBot /healthcheck (two MySQL round-trips on the bot event loop) median over 5m is slow: DB or event loop lagging, users wait for replies. Median, not average: httpcheck records time=0 for timed-out probes; past 50% timeouts clear_transcript_bot_healthcheck fires instead

# Тихие проверки /alerts/<имя>: бот жив, но у пользователей что-то ломается.
# Только bad_status (бот ответил 503): недоступность и таймаут ловит
# clear_transcript_bot_healthcheck, второй алерт о лежащем боте не нужен.
# crit, а не warn: получатель по умолчанию пропускает в Telegram только CRITICAL.
# Имя не кончается на _healthcheck — это не простой для статус-страницы и чатов.
    template: clear_transcript_bot_failure_spike
          on: httpcheck.status
chart labels: _collect_job=clear_transcript_bot_failure_spike
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of bad_status
       units: status
       every: 30s
        crit: $this > 0.5
       delay: down 15m multiplier 1.5 max 1h
          to: sysadmin
        info: ClearTranscriptBot: одна причина сбоя (скачивание, конвертация, старт распознавания, провайдер) за час задела 2+ пользователей — curl 127.0.0.1:9010/alerts/failure_spike на finland-01 покажет какая

    template: clear_transcript_bot_payment_reconciled
          on: httpcheck.status
chart labels: _collect_job=clear_transcript_bot_payment_reconciled
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of bad_status
       units: status
       every: 30s
        crit: $this > 0.5
       delay: down 15m multiplier 1.5 max 1h
          to: sysadmin
        info: ClearTranscriptBot: за последний час зачислен платёж, который у нас уже был закрыт, а банк подтвердил. Деньги дошли сами, но платёж закрылся раньше банка — найти в pm2-логах "CONFIRMED at the bank" и разобрать, почему

    template: clear_transcript_bot_inbound_silence
          on: httpcheck.status
chart labels: _collect_job=clear_transcript_bot_inbound_silence
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -3m unaligned of bad_status
       units: status
       every: 60s
        crit: $this > 0.5
       delay: down 15m multiplier 1.5 max 1h
          to: sysadmin
        info: ClearTranscriptBot: файлы перестали приходить в часы, когда такой тишины не бывает (обе платформы 120 мин в 11–23 МСК; Telegram 180 мин в будни 10–23; Max 180 мин в будни 10–19). Возможно, встал polling или сломан приём файлов — curl 127.0.0.1:9010/alerts/inbound_silence на finland-01 покажет, какая платформа молчит

# Свежесть фоновых задач по файлам-меткам в ~/ClearTranscriptBot/.markers на
# finland-01 (filecheck-джобы там же, в host_vars). Метку трогает только чистый
# прогон, поэтому вставшая или падающая задача видна как устаревший файл.
# Тихие, как проверки выше: бот при этом жив.

# Напоминание о неподтверждённой записи: тик раз в 5 минут, 22 минуты = четыре
# пропуска подряд.
    template: clear_transcript_bot_remind_pending_stale
          on: filecheck.file_modification_time_ago
chart labels: _collect_job=clear_transcript_bot_remind_pending
       class: Errors
        type: Data Collector
   component: Scheduler
      lookup: max -2m unaligned of mtime_ago
       units: seconds
       every: 1m
        crit: $this > (22 * 60)
       delay: down 15m multiplier 1.5 max 1h
          to: sysadmin
        info: ClearTranscriptBot: задача напоминаний о неподтверждённых записях не завершалась чисто дольше 22 минут — встала или падает на каждом тике, смотреть pm2-логи

# Ops-дайджесты шлёт Mac владельца (launchd + claude -p), метку ставит
# run_digest.sh по ssh после отправки в Telegram. Ежедневные: 54 часа = два
# пропуска подряд — один день может выпасть из-за неудачного ssh, а все настоящие
# пропуски в логах (три с июня) длились от 69 часов.
    template: clear_transcript_bot_daily_digest_stale
          on: filecheck.file_modification_time_ago
chart labels: _collect_job=clear_transcript_bot_daily_digest_*
       class: Errors
        type: Data Collector
   component: Ops digest
      lookup: max -2m unaligned of mtime_ago
       units: seconds
       every: 5m
        crit: $this > (54 * 3600)
       delay: down 1h
          to: sysadmin
        info: ClearTranscriptBot: ежедневный дайджест (${label:_collect_job}) не приходил два дня — Mac выключен, истёк вход claude или не дошла метка; лог в ~/Library/Logs/clear-transcript-bot-*-digest.log

# Еженедельные (понедельник): восемь дней = пропущенный понедельник плюс сутки.
    template: clear_transcript_bot_weekly_digest_stale
          on: filecheck.file_modification_time_ago
chart labels: _collect_job=clear_transcript_bot_weekly_digest_*
       class: Errors
        type: Data Collector
   component: Ops digest
      lookup: max -2m unaligned of mtime_ago
       units: seconds
       every: 5m
        crit: $this > (8 * 24 * 3600)
       delay: down 1h
          to: sysadmin
        info: ClearTranscriptBot: еженедельный дайджест (${label:_collect_job}) не пришёл в понедельник — Mac выключен, истёк вход claude или не дошла метка; лог в ~/Library/Logs/clear-transcript-bot-*-digest.log

# Пропавшая метка уносит с собой график возраста, а с ним и тревоги выше —
# поэтому отсутствие файла тоже сигнал. up 10m: новая метка появляется только
# после первого чистого прогона задачи, и проверка, доехавшая раньше, звонила зря
# (15.11, remind_pending — 9 минут).
    template: clear_transcript_bot_marker_missing
          on: filecheck.file_existence_status
chart labels: _collect_job=clear_transcript_bot_*
       class: Errors
        type: Data Collector
   component: Scheduler
      lookup: max -2m unaligned of not_exist
       units: status
       every: 1m
        crit: $this > 0
       delay: up 10m down 15m multiplier 1.5 max 1h
          to: sysadmin
        info: ClearTranscriptBot: нет файла-метки ${label:_collect_job} в ~/ClearTranscriptBot/.markers на finland-01 — свежесть задачи проверить нечем
