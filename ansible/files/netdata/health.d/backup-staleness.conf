# Backup freshness: the mysql/clickhouse backup scripts touch a `.last-success`
# marker only on a clean run, so its age flags a stalled or failing backup. Bound
# to the go.d filecheck jobs named *_backup; evaluated on the parent only.
# The mtime context/dimension name varies by netdata version. The original
# guess (file_time_since_modification / time_since_modification) matched no
# live chart, so this alarm had never fired; verified against the running
# agent 2026-09-07: filecheck.file_modification_time_ago / mtime_ago
# (`curl -s localhost:19999/api/v1/charts | grep filecheck`). Re-verify after
# a netdata major upgrade — a rename here fails silently.
    template: backup_marker_stale
          on: filecheck.file_modification_time_ago
chart labels: _collect_job=*_backup
       class: Errors
        type: System
   component: Backup
      lookup: max -2m of mtime_ago
       units: seconds
       every: 5m
        warn: $this > (30 * 3600)
        crit: $this > (50 * 3600)
       delay: down 1h
          to: sysadmin
        info: backup .last-success marker (${label:_collect_job}) is stale — the backup has stalled or is failing
