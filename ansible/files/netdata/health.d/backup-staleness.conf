# Backup freshness: the mysql/clickhouse scripts touch `.last-success` only on
# a clean run, so the marker's age flags a stalled or failing backup.
    template: backup_marker_stale
          on: filecheck.file_modification_time_ago
chart labels: _collect_job=*_backup
       class: Errors
        type: System
   component: Backup
      lookup: max -2m of mtime_ago
       units: seconds
       every: 5m
        warn: $this > (30 * 3600)
        crit: $this > (50 * 3600)
       delay: down 1h
          to: sysadmin
        info: backup .last-success marker (${label:_collect_job}) is stale — the backup has stalled or is failing
