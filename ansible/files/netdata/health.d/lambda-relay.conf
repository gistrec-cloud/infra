# Lambda-реле в AWS (openai/anthropic/telegram): проба без токена ждёт 403. Опрос
# раз в минуту (платные вызовы), поэтому окно 5 минут.
    template: lambda_relay_down
          on: httpcheck.status
chart labels: _collect_job=relay_*
       class: Errors
        type: Web Server
   component: AWS Lambda
      lookup: average -5m unaligned of success
       units: ok
       every: 1m
        crit: $this < 0.5
       delay: down 5m multiplier 1.5 max 1h
          to: sysadmin
        info: Lambda-реле ${label:url} не отвечает на половину проб за 5 минут (502 — упал код, 429 — троттлинг)
