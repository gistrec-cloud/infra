# loquia deep /health, one probe per process: admin (9091) + both language bots
# (9090/9092). Each runs a bounded DB SELECT 1 → 503, so success<1 is the alarm.
# Per-process on purpose: a group pm2 check cannot see one language die.
    template: loquia_health_down
          on: httpcheck.status
chart labels: _collect_job=loquia_*
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: botcrit
        info: loquia ${label:_collect_job} /health is failing (503, refused, or timeout) for 1m
