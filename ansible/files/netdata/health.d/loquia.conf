# loquia deep /health, one probe per pm2 process, jobs named after them:
# loquia_admin (9091), loquia_en (9090), loquia_sr (9092). Each runs a bounded
# DB SELECT 1 → 503, so a failing success ratio is the alarm.
# Per-process on purpose: a group pm2 check cannot see one language die.
    template: loquia_health_down
          on: httpcheck.status
chart labels: _collect_job=loquia_*
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: botcrit
        info: loquia ${label:_collect_job} /health is failing (503, refused, or timeout) on half the probes over 2m
