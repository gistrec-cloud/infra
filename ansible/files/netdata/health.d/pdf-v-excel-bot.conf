# PdfVExcelBot deep /healthcheck (finland-01:9040, ENABLE_HEALTHCHECK=1 в .env
# бота): 503, когда три скачивания файла подряд упали, опрос платежей встал или
# база не отвечает. Первое — ради случая 29.09–09.10: бот был жив, а каждый файл
# из Telegram терялся двенадцать дней. Счётчик сбоев живёт в памяти процесса:
# рестарт или первое удачное скачивание снимают алерт.
    template: pdf_v_excel_bot_healthcheck
          on: httpcheck.status
chart labels: _collect_job=pdf_v_excel_bot
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 2m multiplier 1.5 max 1h
          to: botcrit
        info: PdfVExcelBot /healthcheck is failing (downloads failing in a row, poller stalled, DB down, refused, or timeout) on half the probes over 2m
