# low-price-flights (flights.gistrec.cloud, finland-01:9020) — свежесть
# Aviasales-поллера. /healthcheck отдаёт 503, когда последний удачный свип
# старше 2ч (8 пропущенных 15-минутных): одинаково ловит «веб жив, поллер
# умер», протухший TRAVELPAYOUTS_TOKEN и мёртвую MySQL.
    template: low_price_flights_poller_stale
          on: httpcheck.status
chart labels: _collect_job=low_price_flights
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: low-price-flights /healthcheck отдаёт 503 или недоступен 1м — поллер молчит >2ч либо веб/БД лежат
