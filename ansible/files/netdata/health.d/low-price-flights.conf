# low-price-flights (flights.gistrec.cloud, finland-01:9020) — свежесть
# Aviasales-поллера. Веб-процесс отвечает /healthcheck 503, когда последний
# удачный свип старше 2ч (8 пропущенных 15-минутных свипов): ловит «веб жив,
# поллер умер», протухший TRAVELPAYOUTS_TOKEN и мёртвую MySQL одинаково;
# упавший веб-процесс валит пробу целиком. Джоба локальная на finland-01,
# чарт стримится сюда — алерт ТОЛЬКО у родителя (no-double-notify).
# delay up 5m: стримящийся чарт едет через RF↔EU линк — та же терпимость к
# флапу, что у остальных EU-алертов (см. askads.conf).
    template: low_price_flights_poller_stale
          on: httpcheck.status
chart labels: _collect_job=low_price_flights
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: low-price-flights /healthcheck отдаёт 503 или недоступен 1м — поллер молчит >2ч либо веб/БД лежат
