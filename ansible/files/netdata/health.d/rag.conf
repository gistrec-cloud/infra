# Общие RAG-сервисы на russia-03: embedder (эмбеддинги, pm2) и Qdrant (векторы,
# docker). Пробы — rag_embedder / rag_qdrant в host_vars/russia-03.yml.
    template: rag_service_down
          on: httpcheck.status
chart labels: _collect_job=rag_*
       class: Errors
        type: Web Server
   component: RAG
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: ${label:url} не отвечает на половину проб за 2 минуты — поиск по базам знаний (kb_search) не работает
