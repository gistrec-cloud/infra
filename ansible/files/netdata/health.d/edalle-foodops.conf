# edalle-foodops: VPS russia-02 (host_vars/russia-02.yml). Систему и деплой держит репозиторий проекта.
# Проверки внешние, по https: /healthz — процесс + SELECT 1 к обеим базам, заодно
# ловит истёкший TLS-сертификат; /backup-health — 503, когда последний полный бэкап
# (локально + restic в S3) старше 30 часов.
    template: edalle_foodops_prod_down
          on: httpcheck.status
chart labels: _collect_job=edalle_foodops_prod
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 2m multiplier 1.5 max 1h
# botcrit, а не sysadmin: sysadmin — только Telegram, и падение Selectel 2026-10-20
# пришло туда одним сообщением, которое потерялось. botcrit дублирует в Pushover
# с критическим приоритетом. testing и бэкап остаются на sysadmin — ночью не будят.
          to: botcrit
        info: edalle-foodops prod /healthz is failing (process down, DB unavailable, TLS expired, refused, or timeout) on half the probes over 2m

    template: edalle_foodops_testing_down
          on: httpcheck.status
chart labels: _collect_job=edalle_foodops_testing
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -5m unaligned of success
       units: ok
       every: 1m
        crit: $this < 0.5
       delay: down 10m multiplier 1.5 max 2h
          to: sysadmin
        info: edalle-foodops testing /healthz is failing on half the probes over 5m

# Бэкап: только bad_status (сервер ответил, но не 200 — это наш 503). Недоступность
# хоста, таймаут и TLS ловит edalle_foodops_prod_down, второй алерт не нужен.
    template: edalle_foodops_backup_stale
          on: httpcheck.status
chart labels: _collect_job=edalle_foodops_backup
       class: Errors
        type: System
   component: Backup
      lookup: min -5m unaligned of bad_status
       units: status
       every: 1m
        crit: $this > 0
       delay: down 1h
          to: sysadmin
        info: edalle-foodops: no full backup (local + S3) in the last 30 hours
