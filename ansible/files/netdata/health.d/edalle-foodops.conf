# edalle-foodops: отдельный VPS вне этого репо (деплой живёт в репозитории проекта).
# Проверки внешние, по https: /healthz — процесс + SELECT 1 к обеим базам, заодно
# ловит истёкший TLS-сертификат; /backup-health — 503, когда последний полный бэкап
# (локально + restic в S3) старше 30 часов.
    template: edalle_foodops_prod_down
          on: httpcheck.status
chart labels: _collect_job=edalle_foodops_prod
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: edalle-foodops prod /healthz is failing (process down, DB unavailable, TLS expired, refused, or timeout) for 1m

    template: edalle_foodops_testing_down
          on: httpcheck.status
chart labels: _collect_job=edalle_foodops_testing
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -5m unaligned of success
       units: ok
       every: 1m
        crit: $this < 1
       delay: down 10m multiplier 1.5 max 2h
          to: sysadmin
        info: edalle-foodops testing /healthz is failing for 5m

# Бэкап: только bad_status (сервер ответил, но не 200 — это наш 503). Недоступность
# хоста, таймаут и TLS ловит edalle_foodops_prod_down, второй алерт не нужен.
    template: edalle_foodops_backup_stale
          on: httpcheck.status
chart labels: _collect_job=edalle_foodops_backup
       class: Errors
        type: System
   component: Backup
      lookup: min -5m unaligned of bad_status
       units: status
       every: 1m
        crit: $this > 0
       delay: down 1h
          to: sysadmin
        info: edalle-foodops: no full backup (local + S3) in the last 30 hours
