 template: edalle_recipe_bot_healthcheck
       on: httpcheck.status
    class: Errors
     type: Web Server
component: edalle-recipe-bot
chart labels: _collect_job=edalle_recipe_bot
     lookup: average -2m unaligned of success
    units: status
    every: 10s
     crit: $this < 0.5
    delay: down 1m multiplier 1.5 max 10m
     info: edalle-recipe-bot /healthcheck on finland-01 is failing (DB, stale schedulers or disk)
       to: botcrit
