# edalle-recipe-bot (finland-01, pm2). Три источника сигнала: httpcheck /healthcheck (БД,
# heartbeat планировщиков, диск), httpcheck /metrics (экспортер жив и отдаёт ключевую серию)
# и значения /metrics через go.d prometheus job edalle_recipe_bot (host_vars/finland-01.yml),
# которые netdata публикует как prometheus.edalle_recipe_bot.<серия>.
#
# Имена серий — из web/metrics.py в репо бота (EdalleRecipeBot). Правила лежат здесь, а не в
# репо бота через remote: true, потому что чекаут бота на finland-01, а правила читает парент
# russia-03. Переименовали метрику в коде — правим правило здесь тем же днём.

 template: edalle_recipe_bot_healthcheck
       on: httpcheck.status
    class: Errors
     type: Web Server
component: edalle-recipe-bot
chart labels: _collect_job=edalle_recipe_bot
   lookup: average -2m unaligned of success
    units: status
    every: 10s
     crit: $this < 0.5
    delay: down 1m multiplier 1.5 max 10m
     info: edalle-recipe-bot /healthcheck on finland-01 is failing (DB, stale schedulers or disk)
       to: botcrit

# /metrics сам по себе (httpcheck с response_match на recipe_bot_download_failure_ratio_6h).
# Пропавшая серия переводит value-правила ниже в REMOVED без уведомления, а httpcheck отвечает
# всегда — паттерн vkadstool_metrics_down.
 template: edalle_recipe_bot_metrics_down
       on: httpcheck.status
    class: Errors
     type: Web Server
component: edalle-recipe-bot
chart labels: _collect_job=edalle_recipe_bot_metrics
   lookup: average -2m unaligned of success
    units: status
    every: 10s
     crit: $this < 0.5
    delay: down 2m multiplier 1.5 max 1h
     info: edalle-recipe-bot /metrics is failing or no longer exports recipe_bot_download_failure_ratio_6h (exporter broken, analyses query failing) — the value alarms below are blind
       to: botcrit

# Cookies/логин платформы протухли: проба эталонной ссылки (раз в 6 часов) упала с login_required.
# Один чарт на label platform, шаблон покрывает все четыре.
 template: edalle_recipe_bot_cookies_expired
       on: prometheus.edalle_recipe_bot.recipe_bot_probe_login_required
    class: Errors
     type: Data Collection
component: edalle-recipe-bot
   lookup: max -1m unaligned of recipe_bot_probe_login_required
    units: boolean
    every: 1m
     crit: $this > 0
    delay: down 10m multiplier 1.5 max 1h
     info: edalle-recipe-bot: ${label:platform} refuses the reference video without a login — cookies expired, re-export them (bot README «Cookies и логин на платформах»)
       to: botcrit

# Проба не проходит по другой причине (сеть, геоблок, сломался экстрактор). Бот сам повторяет
# пробу через 20 с, так что сюда доходит только устойчивый сбой; -1 (ещё не пробовали) не warn.
 template: edalle_recipe_bot_probe_failed
       on: prometheus.edalle_recipe_bot.recipe_bot_probe_ok
    class: Errors
     type: Data Collection
component: edalle-recipe-bot
   lookup: max -1m unaligned of recipe_bot_probe_ok
    units: status
    every: 1m
     warn: $this == 0
    delay: down 10m multiplier 1.5 max 1h
     info: edalle-recipe-bot: the reference video on ${label:platform} cannot be probed from finland-01 for a reason other than login (network, geo-block, extractor change)
       to: botcrit

# Реальные анализы за 6 часов: больше половины падают на стадии скачивания. Пока завершённых
# меньше трёх, серия равна -1, поэтому одна тестовая ссылка никого не разбудит.
 template: edalle_recipe_bot_download_failures
       on: prometheus.edalle_recipe_bot.recipe_bot_download_failure_ratio_6h
    class: Errors
     type: Data Collection
component: edalle-recipe-bot
   lookup: max -1m unaligned of recipe_bot_download_failure_ratio_6h
    units: ratio
    every: 1m
     crit: $this >= 0.5
    delay: up 10m down 30m multiplier 1.5 max 1h
     info: edalle-recipe-bot: more than half of the analyses in the last 6h failed while downloading (yt-dlp broken, platform blocking the server IP, cookies) — users get «Не удалось скачать видео»
       to: botcrit

# То же по всем стадиям (Gemini/Scribe/Claude недоступны, таймауты): warn, причина обычно внешняя.
 template: edalle_recipe_bot_failures
       on: prometheus.edalle_recipe_bot.recipe_bot_failure_ratio_6h
    class: Errors
     type: Data Collection
component: edalle-recipe-bot
   lookup: max -1m unaligned of recipe_bot_failure_ratio_6h
    units: ratio
    every: 1m
     warn: $this >= 0.5
    delay: up 10m down 30m multiplier 1.5 max 1h
     info: edalle-recipe-bot: more than half of the analyses in the last 6h failed at some stage (providers down, timeouts) — check pm2 logs and the DataLens error chart
       to: botcrit
