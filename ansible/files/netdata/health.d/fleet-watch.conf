# Reverse watch: finland-01 probes the parent's /health over wg0. The parent is
# also the fleet prober, so if it dies nothing else would notify — this alarm
# fires from finland-01's own health engine. Deployed ONLY there, on its own
# watch_* prefix (see README: a shared prefix would double-notify).
    template: fleet_watch_down
          on: httpcheck.status
chart labels: _collect_job=watch_*
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: fleetcrit
        info: fleet /health watch ${label:url} (the netdata parent) is failing (down, refused, or timeout) for 1m
