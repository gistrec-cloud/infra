# Valid: интеграция с API Честного знака. Метрики — /metrics API (job val_id, 127.0.0.1:8120)
# и worker'а (job val_id_worker, 127.0.0.1:8121); имена метрик — znakhub_* (не менялись).
# Развёрнуто на russia-03: копия этого файла — infra/ansible/files/netdata/health.d/val-id.conf,
# джобы — host_vars/russia-03.yml (netdata_prometheus_jobs, netdata_httpcheck_jobs). Меняешь алармы
# здесь — скопируй в infra и перезапусти плей netdata.

# Внешняя проба https://val-id.ru/healthz (httpcheck-джоба val_id_health у парента).
# «Процесс исчез» ловит pm2_app_down; здесь — «pm2 жив, а сайт отдаёт 502/таймаут»:
# nginx, TLS, зависший API. Аларм простоя: уходит и в чат проекта (alert_chats).
    template: val_id_health_down
          on: httpcheck.status
chart labels: _collect_job=val_id_health
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 2m multiplier 1.5 max 1h
          to: botcrit
        info: Valid: https://val-id.ru/healthz не отвечает (5xx, отказ или таймаут) на половину проб за 2 минуты

# Worker не крутит цикл: выгрузки встали целиком.
 template: val_id_worker_stalled
       on: prometheus.val_id_worker.znakhub_worker_last_loop_timestamp
    class: Errors
     type: Data Collection
component: val-id
     calc: $now - $znakhub_worker_last_loop_timestamp
    units: seconds
    every: 1m
     crit: $this > 300
    delay: down 10m multiplier 1.5 max 1h
     info: Valid: worker не делал ни одного цикла больше 5 минут — выгрузки из ЧЗ стоят
       to: botcrit

# znakhub_chz_errors_last_hour — три графика (метка kind), у каждого одно измерение:
# график выбираем по метке, а не по имени измерения.

# Токен ЧЗ истёк или отозван: все вызовы падают с 401, выгрузки ждут нового токена.
 template: val_id_chz_auth_failing
       on: prometheus.val_id.znakhub_chz_errors_last_hour
    class: Errors
     type: Data Collection
component: val-id
chart labels: kind=auth
   lookup: max -2m unaligned
    units: errors
    every: 1m
     crit: $this > 0
    delay: down 15m multiplier 1.5 max 2h
     info: Valid: ЧЗ отвечает 401 — токен организации истёк, его меняют на экране «Подключение ЧЗ» (позже — signer)
       to: botcrit

# Упираемся в лимиты ЧЗ. Единичные 429 — норма (лимитер их переживает), поток — нет.
 template: val_id_chz_rate_limited
       on: prometheus.val_id.znakhub_chz_errors_last_hour
    class: Latency
     type: Data Collection
component: val-id
chart labels: kind=rate_limited
   lookup: max -2m unaligned
    units: errors
    every: 1m
     warn: $this > 20
    delay: down 30m multiplier 1.5 max 2h
     info: Valid: больше 20 ответов 429 от ЧЗ за час — лимиты ниже документированных или квоту делит другая система
       to: sysadmin

# ЧЗ лежит или тормозит: 5xx и сетевые ошибки.
 template: val_id_chz_server_errors
       on: prometheus.val_id.znakhub_chz_errors_last_hour
    class: Errors
     type: Data Collection
component: val-id
chart labels: kind=server
   lookup: max -2m unaligned
    units: errors
    every: 1m
     warn: $this > 10
     crit: $this > 50
    delay: down 30m multiplier 1.5 max 2h
     info: Valid: ЧЗ отвечает 5xx/таймаутами — сервис ЧЗ деградировал (проверьте «Пульс маркировки»)
       to: sysadmin

# Выгрузки падают или приходят с ошибками внутри CSV (COMPLETED, но данных нет из-за ошибки).
 template: val_id_exports_failing
       on: prometheus.val_id.znakhub_export_jobs_failed_24h
    class: Errors
     type: Data Collection
component: val-id
   lookup: max -2m unaligned
    units: jobs
    every: 5m
     warn: $this > 0
    delay: down 1h
     info: Valid: за сутки есть упавшие выгрузки — смотрите экран «Выгрузки», поле error
       to: sysadmin

 template: val_id_exports_csv_errors
       on: prometheus.val_id.znakhub_export_jobs_error_outcome_24h
    class: Errors
     type: Data Collection
component: val-id
   lookup: max -2m unaligned
    units: jobs
    every: 5m
     warn: $this > 0
    delay: down 1h
     info: Valid: ЧЗ вернул ошибки внутри CSV — вероятно, поменялся формат параметров выгрузки
       to: sysadmin

# Расписание не срабатывает: есть включённые правила, просроченные больше чем на 10 минут.
# Worker жив (иначе сработал бы val_id_worker_stalled), но до расписания не доходит.
 template: val_id_schedules_overdue
       on: prometheus.val_id.znakhub_export_schedules_overdue
    class: Errors
     type: Data Collection
component: val-id
   lookup: min -15m unaligned
    units: rules
    every: 5m
     warn: $this > 0
    delay: down 30m multiplier 1.5 max 2h
     info: Valid: правила расписания просрочены больше 15 минут — плановые выгрузки не создаются, смотрите лог worker'а
       to: sysadmin

# Письма с уведомлениями не уходят: исчерпали попытки (SMTP сломан или адрес отклонён).
 template: val_id_emails_failing
       on: prometheus.val_id.znakhub_emails_failed_24h
    class: Errors
     type: Data Collection
component: val-id
   lookup: max -2m unaligned
    units: emails
    every: 5m
     warn: $this > 0
    delay: down 1h
     info: Valid: за сутки есть письма, которые не удалось отправить — проверьте SMTP (znakhub-admin send-test-email)
       to: sysadmin

# Очередь писем не разбирается. График выбираем по метке status.
 template: val_id_email_outbox_stuck
       on: prometheus.val_id.znakhub_email_outbox
    class: Errors
     type: Data Collection
component: val-id
chart labels: status=pending
   lookup: min -30m unaligned
    units: emails
    every: 5m
     warn: $this > 50
    delay: down 1h
     info: Valid: больше 50 писем ждут отправки дольше 30 минут — worker не разбирает очередь или SMTP недоступен
       to: sysadmin

# Окончательное удаление организации застряло (ADR 0009, этап 4): срок прошёл больше 12 часов
# назад, а организация всё ещё в базе. Worker жив (иначе val_id_worker_stalled), но удаление
# падает на каждом проходе — причина в лог worker'а и error_events (location
# org_deletion.purge_due), класс ошибки — org_deletions.last_error; список — znakhub-admin org-deletions.
 template: val_id_org_purge_stuck
       on: prometheus.val_id.znakhub_org_purge_overdue
    class: Errors
     type: Data Collection
component: val-id
   lookup: min -30m unaligned
    units: orgs
    every: 15m
     warn: $this > 0
    delay: down 1h
     info: Valid: окончательное удаление организации не закончено через 12 ч после срока — смотрите лог worker'а и znakhub-admin org-deletions
       to: sysadmin
