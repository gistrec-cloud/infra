 template: recipe_bot_healthcheck
       on: httpcheck.status
    class: Errors
     type: Web Server
component: recipe-bot
chart labels: _collect_job=recipe_bot
     calc: $success
    units: status
    every: 10s
     crit: $this < 1
    delay: down 1m multiplier 1.5 max 10m
     info: recipe-bot /healthcheck on finland-01 is failing (DB, stale schedulers or disk)
       to: botcrit
