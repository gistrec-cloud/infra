# Свежесть сделок в Kafka (market-data-collector на finland-01).
#
# mtime маркера <topic>.last-delivery — время последнего ack брокера, а не
# отправки: коллектор с отозванным ключом жив, читает биржи и копит
# failed_total, а в топик не попадает ничего (так 19.11 пролежали 2 часа).
# Сделок десятки в секунду, пять минут тишины уже не рынок.

    template: market_data_stale
          on: filecheck.file_modification_time_ago
chart labels: _collect_job=market_data_*
       class: Errors
        type: Data Collector
   component: Market data
      lookup: max -1m unaligned of mtime_ago
       units: seconds
       every: 1m
        warn: $this > (5 * 60)
        crit: $this > (15 * 60)
       delay: down 5m
          to: sysadmin
        info: в топик Kafka давно не доходят сделки — брокер не принимает запись или коллектор стоит

# Пропавший маркер — нечего проверять, тревога выше молчит вместе с графиком.

    template: market_data_mark_missing
          on: filecheck.file_existence_status
chart labels: _collect_job=market_data_*
       class: Errors
        type: Data Collector
   component: Market data
      lookup: max -1m unaligned of not_exist
       units: status
       every: 1m
        crit: $this > 0
       delay: down 5m
          to: sysadmin
        info: нет маркера свежести market-data-collector — возраст данных в топике не проверить
