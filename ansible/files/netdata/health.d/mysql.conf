# Ставится под стоковым именем mysql.conf и заменяет его: отставание реплики
# отложено (RF↔EU линк флапает), блокировки таблиц и galera парку не нужны.
# Живость — по возрасту последнего сбора: упавший сервер или отвергнутый
# пользователь netdata одинаково оставляют чарт без новых данных.
    template: mysql_down
          on: mysql.queries
       class: Errors
        type: Database
   component: MySQL
        calc: $now - $last_collected_t
       units: seconds ago
       every: 10s
        crit: $this > 60
       delay: down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: MySQL не отдаёт статус больше минуты (сервер лежит или пользователь netdata отвергнут)

    template: mysql_connections
          on: mysql.connections_active
       class: Utilization
        type: Database
   component: MySQL
        calc: $active * 100 / $limit
       units: %
       every: 10s
        warn: $this > (($status >= $WARNING)  ? (60) : (70))
        crit: $this > (($status == $CRITICAL) ? (80) : (90))
       delay: down 15m multiplier 1.5 max 1h
          to: sysadmin
        info: занято соединений от max_connections

    template: mysql_replication
          on: mysql.slave_status
       class: Errors
        type: Database
   component: MySQL
        calc: ($sql_running <= 0 OR $io_running <= 0) ? 0 : 1
       units: ok/failed
       every: 10s
        crit: $this == 0
       delay: down 5m multiplier 1.5 max 1h
          to: sysadmin
        info: репликация остановлена (IO или SQL поток не работает)

    template: mysql_10s_slow_queries
          on: mysql.queries
       class: Latency
        type: Database
   component: MySQL
      lookup: sum -10s of slow_queries
       units: slow queries
       every: 10s
        warn: $this > (($status >= $WARNING)  ? (5)  : (10))
        crit: $this > (($status == $CRITICAL) ? (10) : (20))
       delay: down 5m multiplier 1.5 max 1h
          to: sysadmin
        info: медленные запросы за последние 10 секунд
