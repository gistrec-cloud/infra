# foto-govorit-bot (finland-01:9030) — глубокий /healthcheck процесса бота: SELECT 1,
# отметка воркера не старше 2 мин, нет задач в queued >30 мин или running >40 мин,
# опрос оплат шёл не позже 2 мин назад, банк не молчит >5 мин. Любой провал — 503.
    template: foto_govorit_bot_healthcheck
          on: httpcheck.status
chart labels: _collect_job=foto_govorit_bot
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 2m multiplier 1.5 max 1h
          to: botcrit
        info: FotoGovoritBot /healthcheck is failing (HTTP 503, refused, or timeout) on half the probes over 2m
