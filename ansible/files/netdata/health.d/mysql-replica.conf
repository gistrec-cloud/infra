# Replica health on russia-03 (go.d mysql job in host_vars). Deployed as
# mysql.conf ON PURPOSE: shadows the stock mysql alarms — their lag thresholds
# (warn 10s / crit 30s) are LAN-tuned and would page on every RF↔EU wobble;
# the other stock alarms (slow queries, locks, connections) guard an
# app-facing server, which the standby is not. A stale replica means promote
# = data loss, so staleness must reach Telegram (crit, `db` role unmapped in
# Pushover). Template names stay stock for recognisability.
    template: mysql_replication
          on: mysql.slave_status
       class: Errors
        type: Database
   component: MySQL
        calc: ($sql_running <= 0 OR $io_running <= 0)?0:1
       units: ok/failed
       every: 10s
        crit: $this == 0
       delay: down 5m multiplier 1.5 max 1h
          to: db
        info: replication threads on the standby (0 = IO or SQL thread stopped, 1 = replicating)

# Hysteresis mirrors the stock template; thresholds are WAN-sized. crit at
# 10 minutes behind (clears under 5) — link wobbles ride out in WARNING,
# which the |critical Telegram filter keeps dashboard-only.
    template: mysql_replication_lag
          on: mysql.slave_behind
       class: Latency
        type: Database
   component: MySQL
        calc: $seconds
       units: seconds
       every: 10s
        warn: $this > (($status >= $WARNING)  ? (30)  : (60))
        crit: $this > (($status == $CRITICAL) ? (300) : (600))
       delay: down 15m multiplier 1.5 max 1h
          to: db
        info: seconds the standby's SQL thread is behind the primary
