# Свежесть данных глюкозы.
#
# mtime файла .last-reading — время самого свежего измерения в базе, а не
# время последнего опроса. Разница существенна: сборщик переписывает снимок
# и тогда, когда Abbott недоступен, поэтому «процесс жив» и «данные идут» —
# разные утверждения, и следить нужно за вторым.
#
# Час без данных — не всегда авария: LibreLinkUp молчит, пока на руке нет
# сенсора, так что смена сенсора выглядит здесь дырой той ширины, сколько
# заняла замена. Отсюда warn на получасе и crit на часе.
#
# Джоба filecheck живёт на finland-01 (netdata_filecheck_files), чарт
# стримится сюда; правило — только у родителя, как у backup-staleness, иначе
# двойные уведомления. Контекст/имя измерения сверены с живыми чартами
# 2026-09-07: filecheck.file_modification_time_ago / mtime_ago.

    template: glucose_data_stale
          on: filecheck.file_modification_time_ago
chart labels: _collect_job=glucose
       class: Errors
        type: Data Collector
   component: Glucose collector
      lookup: max -1m unaligned of mtime_ago
       units: seconds
       every: 1m
        warn: $this > (30 * 60)
        crit: $this > (60 * 60)
       delay: down 15m multiplier 1.5 max 1h
          to: fleetcrit
        info: no new glucose reading — sensor off, LibreLinkUp unreachable, or the collector is down

# Пропавший файл — это не «данные свежие», а «проверять нечего»: вместе с
# ним исчезает и график mtime_ago, а с ним тревога выше. Молчащий мониторинг
# неотличим от исправного, поэтому отсутствие метки — тоже авария.

    template: glucose_mark_missing
          on: filecheck.file_existence_status
chart labels: _collect_job=glucose
       class: Errors
        type: Data Collector
   component: Glucose collector
      lookup: max -1m unaligned of not_exist
       units: status
       every: 1m
        crit: $this > 0
       delay: down 15m multiplier 1.5 max 1h
          to: fleetcrit
        info: the glucose freshness mark is missing, so its age cannot be checked
