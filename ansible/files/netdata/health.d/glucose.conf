# Свежесть данных глюкозы.
#
# mtime файла .last-reading — время самого свежего измерения в базе, а не время
# последнего опроса: сборщик переписывает снимок и когда Abbott недоступен,
# поэтому «процесс жив» и «данные идут» — разные утверждения.
#
# Час без данных — не всегда авария: LibreLinkUp молчит, пока на руке нет
# сенсора, и замена выглядит здесь дырой своей ширины. Отсюда warn/crit 30м/1ч.

    template: glucose_data_stale
          on: filecheck.file_modification_time_ago
chart labels: _collect_job=glucose
       class: Errors
        type: Data Collector
   component: Glucose collector
      lookup: max -1m unaligned of mtime_ago
       units: seconds
       every: 1m
        warn: $this > (30 * 60)
        crit: $this > (60 * 60)
       delay: down 15m multiplier 1.5 max 1h
          to: fleetcrit
        info: no new glucose reading — sensor off, LibreLinkUp unreachable, or the collector is down

# Пропавший файл — это не «данные свежие», а «проверять нечего»: вместе с
# ним исчезает и график mtime_ago, а с ним тревога выше. Молчащий мониторинг
# неотличим от исправного, поэтому отсутствие метки — тоже авария.

    template: glucose_mark_missing
          on: filecheck.file_existence_status
chart labels: _collect_job=glucose
       class: Errors
        type: Data Collector
   component: Glucose collector
      lookup: max -1m unaligned of not_exist
       units: status
       every: 1m
        crit: $this > 0
       delay: down 15m multiplier 1.5 max 1h
          to: fleetcrit
        info: the glucose freshness mark is missing, so its age cannot be checked

# РФ-копия (apps.yml: glucose-renderer) собирает снимок сама, раз в минуту.
# Здесь mtime — время прогона, а НЕ возраст данных: рендер перерисует и
# вчерашние цифры, за их свежестью следит glucose_data_stale выше.
#
# Снаружи молчащий рендер не виден — nginx отдаёт последний снимок с 200, а
# geo не подстрахует: healthcheck'и аккаунту Gcore недоступны.

    template: glucose_render_stopped
          on: filecheck.file_modification_time_ago
chart labels: _collect_job=glucose_renderer
       class: Errors
        type: Data Collector
   component: Glucose renderer
      lookup: max -1m unaligned of mtime_ago
       units: seconds
       every: 1m
        warn: $this > (10 * 60)
        crit: $this > (30 * 60)
       delay: up 5m down 15m multiplier 1.5 max 1h
          to: fleetcrit
        info: the RF glucose renderer stopped running — cron, the venv, or the local replica
