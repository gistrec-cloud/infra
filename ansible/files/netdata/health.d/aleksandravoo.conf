# aleksandravoo /api/health (finland-01:5000). Bare Next.js 200, no deps — so
# success<1 means the process is down, refusing or timing out, nothing else.
# The glob also covers aleksandravoo_staging if that probe is ever enabled.
    template: aleksandravoo_health_down
          on: httpcheck.status
chart labels: _collect_job=aleksandravoo_*
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: aleksandravoo ${label:_collect_job} /api/health is failing (refused, 5xx or timeout) on half the probes over 2m
