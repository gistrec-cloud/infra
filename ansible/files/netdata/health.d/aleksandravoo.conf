# aleksandravoo /api/health alarm. The app runs on finland-01:5000 (job
# aleksandravoo_prod) and streams its chart to this parent, which owns the
# alarm — same split as askads_cloud and cleartranscript, so finland does not
# double-notify. The probe is a bare Next.js 200 with no dependencies, so
# success<1 means the process is down, refusing or timing out.
#
# The job glob covers aleksandravoo_staging too, if that probe is ever enabled
# (it is off until its DB tangle is fixed — see host_vars/finland-01.yml).
    template: aleksandravoo_health_down
          on: httpcheck.status
chart labels: _collect_job=aleksandravoo_*
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: aleksandravoo ${label:_collect_job} /api/health is failing (refused, 5xx or timeout) for 1m
