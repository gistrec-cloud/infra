# jobs (finland-01:8097) /healthz: SELECT из SQLite → 503 при недоступной БД.
# «Процесс исчез» ловит pm2_jobs; здесь — «процесс жив, но не отвечает / БД сломана».
    template: jobs_health_down
          on: httpcheck.status
chart labels: _collect_job=jobs
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: jobs.gistrec.cloud /healthz is failing (503, refused, or timeout) on half the probes over 2m
