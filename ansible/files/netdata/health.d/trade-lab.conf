# trade-lab: health-сервер (7001 testnet, 7002 mainnet) и дашборд Streamlit (7000)
# на russia-03 → botcrit. heartbeat — 503, если журнальный цикл не шёл ~12ч;
# daily — 503, если LIVE-цикл пропал >26ч или упал. Алерты на метрики /metrics
# живут в репо trade-lab (ops/netdata/health.d, remote: true в host_vars).
    template: trade_lab_heartbeat
          on: httpcheck.status
chart labels: _collect_job=trade_lab_heartbeat
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 5m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab heartbeat down — no journal cycle within ~12h (6-hourly cron dead, process killed, or journal unreadable)

    template: trade_lab_daily_live
          on: httpcheck.status
chart labels: _collect_job=trade_lab_daily
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: average -2m unaligned of success
       units: ok
       every: 30s
        crit: $this < 0.5
       delay: down 30m multiplier 1.5 max 2h
          to: botcrit
        info: trade-lab daily LIVE order cycle unhealthy — missing >26h, or last live outcome failed/unknown_orders/partial

    template: trade_lab_mainnet_heartbeat
          on: httpcheck.status
chart labels: _collect_job=trade_lab_mainnet_heartbeat
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 5m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab MAINNET heartbeat down — no mainnet journal cycle within ~12h (mainnet dry-run cron dead, process killed, or journal unreadable)

    template: trade_lab_mainnet_daily_live
          on: httpcheck.status
chart labels: _collect_job=trade_lab_mainnet_daily
       class: Errors
        type: Data Collection
   component: trade-lab
      lookup: average -2m unaligned of success
       units: ok
       every: 30s
        crit: $this < 0.5
       delay: down 30m multiplier 1.5 max 2h
          to: botcrit
        info: trade-lab MAINNET daily LIVE order cycle unhealthy — missing >26h, failed outcome, or a stale DAILY_DISABLED flag masking live cycles

    template: trade_lab_dashboard
          on: httpcheck.status
chart labels: _collect_job=trade_lab_dashboard
       class: Errors
        type: Web Server
   component: trade-lab
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        # warn, не crit: дашборд — только наблюдение. Telegram парка режет
        # WARNING (|critical), так что это видно лишь на дашборде netdata.
        warn: $this < 0.5
       delay: down 5m multiplier 1.5 max 1h
          to: botcrit
        info: trade-lab monitoring dashboard (Streamlit) not responding on :7000
