# Зеркало Yandex → Gcore (s3-mirror.timer раз в 6 ч): скрипт трогает маркер
# только после чистого прогона. Два пропуска подряд = warn, четыре = crit.
    template: s3_mirror_stale
          on: filecheck.file_modification_time_ago
chart labels: _collect_job=s3_mirror
       class: Errors
        type: System
   component: Backup
      lookup: max -2m of mtime_ago
       units: seconds
       every: 5m
        warn: $this > (13 * 3600)
        crit: $this > (25 * 3600)
       delay: down 1h
          to: sysadmin
        info: зеркало S3 давно не завершалось успешно — копия в Gcore устаревает
