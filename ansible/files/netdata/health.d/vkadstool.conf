# vkadstool deep /health: MySQL + ClickHouse SELECT 1 concurrently, bounded to
# ~3s → 503 on any dep failure. Schedulers and the telegram bot are in-process
# threads, so this single probe covers the whole app.
    template: vkadstool_health_down
          on: httpcheck.status
chart labels: _collect_job=vkadstool
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: vkadstool /health is failing (MySQL/ClickHouse down, 503, refused, or timeout) for 1m

# Scheduler liveness from the app's /metrics (go.d/prometheus job `vkadstool`,
# 127.0.0.1:8010, VkAdsTool#154). vkadstool_job_overdue_ratio = seconds since
# the job's last successful run / its trigger interval; one chart per `job`
# label, so this single template covers every scheduler and picks up new ones
# by itself. /health above cannot see this: a stuck scheduler thread leaves the
# web process green. The ratio resets on app restart (history lives in the
# process), so an active alarm clears until the job misses again — accepted.
# Alarms attach only to contexts that exist — after the first deploy confirm:
#   curl -s localhost:19999/api/v1/contexts | grep prometheus.vkadstool
    template: vkadstool_job_overdue
          on: prometheus.vkadstool.vkadstool_job_overdue_ratio
       class: Errors
        type: Data Collection
   component: vkadstool
      lookup: max -1m unaligned of vkadstool_job_overdue_ratio
       units: intervals
       every: 1m
        warn: $this > 3
        crit: $this > 10
       delay: up 5m down 5m multiplier 1.5 max 1h
          to: sysadmin
        info: vkadstool scheduler job ${label:job} has not completed successfully for more than 3 trigger intervals (stuck thread, VK API or DB hanging) — /health alone cannot see this

# /metrics itself, via httpcheck (job vkadstool_metrics, response_match on the
# refresh_raw_statistics series). A series that stops being scraped turns the
# alarm above into REMOVED with no notification; httpcheck always reports, so a
# broken exporter or a vanished key job lands here as crit.
    template: vkadstool_metrics_down
          on: httpcheck.status
chart labels: _collect_job=vkadstool_metrics
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: vkadstool /metrics is failing or no longer exports the refresh_raw_statistics series (exporter broken, scheduler not registered) — the job_overdue alarm is blind
