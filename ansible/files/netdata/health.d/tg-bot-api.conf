# Telegram Bot API на finland-01: общий (tg_bot_api_shared, клиенты — RF-боты по
# туннелю) и приватный ctb (tg_bot_api_ctb). Корень отдаёт 404 — это и есть «жив».
    template: tg_bot_api_down
          on: httpcheck.status
chart labels: _collect_job=tg_bot_api_*
       class: Errors
        type: Web Server
   component: Telegram Bot API
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: Telegram Bot API ${label:url} не отвечает на половину проб за 2 минуты — боты не получают и не шлют сообщения
