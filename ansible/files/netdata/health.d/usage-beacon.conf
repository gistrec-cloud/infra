# usage-beacon /healthz (russia-03:8095): pings MySQL on finland-01 over wg,
# 503 when that SELECT 1 fails.
#
# Scope: proves the process is up and the DB reachable, NOT that writes land.
# A schema drift leaves /healthz green while every POST /v1/events returns 500 —
# that shows up as a flat events-per-day chart, not here.
    template: usage_beacon_health_down
          on: httpcheck.status
chart labels: _collect_job=usage_beacon
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: average -2m unaligned of success
       units: ok
       every: 10s
        crit: $this < 0.5
       delay: up 5m down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: usage-beacon /healthz is failing (503, refused, or timeout) on half the probes over 2m
