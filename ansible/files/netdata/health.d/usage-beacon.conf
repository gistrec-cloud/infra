# usage-beacon /healthz alarm. The receiver on russia-01:8095 (job usage_beacon)
# pings MySQL on finland-01 over wg and returns 503 when that SELECT 1 fails, so
# success<1 is the alarm — same model as askads below it.
#
# Scope note: /healthz proves the process is up and the database is reachable.
# It does NOT prove writes succeed — a schema drift (app expecting a column the
# table lacks) leaves /healthz green while every POST /v1/events returns 500.
# That class of failure shows up as a flat events-per-day chart, not here.
    template: usage_beacon_health_down
          on: httpcheck.status
chart labels: _collect_job=usage_beacon
       class: Errors
        type: Web Server
   component: HTTP endpoint
      lookup: max -1m unaligned of success
       units: ok
       every: 10s
        crit: $this < 1
       delay: down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: usage-beacon /healthz is failing (503, refused, or timeout) for 1m
