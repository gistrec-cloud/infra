# Живость ClickHouse поверх стоковых clickhouse-алертов (те только про нагрузку
# и рестарт): возраст последнего сбора, как mysql_down в mysql.conf.
    template: clickhouse_down
          on: clickhouse.uptime
       class: Errors
        type: Database
   component: ClickHouse
        calc: $now - $last_collected_t
       units: seconds ago
       every: 10s
        crit: $this > 60
       delay: down 2m multiplier 1.5 max 1h
          to: sysadmin
        info: ClickHouse не отдаёт статус больше минуты (сервер лежит или пользователь netdata отвергнут)
