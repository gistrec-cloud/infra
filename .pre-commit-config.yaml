---
# Run `pre-commit install` once, then hooks fire on every commit.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  # ansible-lint — только в CI: из корня репозитория он не видит
  # ansible/ansible.cfg с относительным vault_password_file, а запуск из нужного
  # каталога стоит Touch ID на каждый коммит в ansible/.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key

  # gitleaks ловит секреты по форме; адрес хоста на секрет не похож, а выдаёт
  # не меньше. Скрипт сам читает индекс, поэтому имена файлов ему не нужны.
  - repo: local
    hooks:
      - id: no-public-ips
        name: no public IPv4 in tracked files
        entry: python3 scripts/check-staged-ips.py
        language: system
        pass_filenames: false
        always_run: true
