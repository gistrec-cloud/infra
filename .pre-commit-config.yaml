---
# Run `pre-commit install` once, then hooks fire on every commit.
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.18.4
    hooks:
      - id: gitleaks

  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.92.0
    hooks:
      - id: terraform_fmt
      - id: terraform_validate

  # ansible-lint здесь НЕ запускается — им владеет CI (.github/workflows/ci.yml),
  # и только там он отрабатывает верно.
  #
  # Хук стоял на v24.7.0 и падал с ModuleNotFoundError: та версия несовместима
  # с ansible-core, который к ней подтягивается. Это заметили только когда
  # pre-commit наконец поставили — до того ни один хук из этого файла вообще не
  # работал. Сломанный хук хуже отсутствующего: он приучает к --no-verify, а
  # тот глушит заодно gitleaks и проверку IP.
  #
  # Свежая версия запускается, но из корня репозитория не видит ansible/ansible.cfg,
  # а там vault_password_file = .vault_pass относительным путём. Без него vault
  # не расшифровывается и сыплются syntax-check. Запуск из нужного каталога это
  # чинит, но ценой обращения в 1Password — то есть Touch ID на каждый коммит,
  # трогающий ansible/. CI стабает пароль и потому свободен от этой платы.

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: detect-private-key

  # gitleaks ловит секреты по форме; адрес хоста на секрет не похож, а выдаёт
  # не меньше. Скрипт сам читает индекс, поэтому имена файлов ему не нужны.
  - repo: local
    hooks:
      - id: no-public-ips
        name: no public IPv4 in tracked files
        entry: python3 scripts/check-staged-ips.py
        language: system
        pass_filenames: false
        always_run: true
